name: Qwave

options:
  bundleIdPrefix: is.8b
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  QwaveKit:
    path: Packages/QwaveKit
  WireGuardKit:
    path: Packages/WireGuardKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # 2.9.5, pinned by commit: the update framework is a trust anchor, and a
    # moved tag must not be able to change what we embed. The SPM binary
    # artifact is additionally checksum-verified by SwiftPM itself.
    revision: 79bc9e872948e47877e76f194cb0c8e0412b0b90

targets:
  Qwave:
    type: application
    platform: macOS
    sources:
      - path: Sources/QwaveApp
    dependencies:
      - package: QwaveKit
        product: QwaveKit
      - package: QwaveKit
        product: WebCredentials
      - package: Sparkle
      - target: PacketTunnel
        embed: true
      - target: CredentialProvider
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: is.8b.qwave
        PRODUCT_NAME: Qwave
        PROVISIONING_PROFILE_SPECIFIER: "$(QWAVE_APP_PROVISIONING_PROFILE)"
    info:
      path: Resources/Qwave/Info.plist
      properties:
        CFBundleName: Qwave
        CFBundleDisplayName: Qwave
        CFBundleShortVersionString: "1.0.0"
        # major*10000 + minor*100 + patch — Sparkle compares this value, and
        # CI enforces the mapping against the release tag.
        CFBundleVersion: "10000"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # Browsers load arbitrary user-chosen web content; ATS is relaxed for
        # web content only (app-level URLSession traffic stays ATS-enforced).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        # TCC purpose strings for web content: WebKit routes getUserMedia and the
        # Geolocation API through the app's usage descriptions. Without these keys
        # the first camera/mic/location request hard-kills the process. Access is
        # still gated per-origin by the in-app prompt (see WebPermissionArbiter);
        # these strings only explain the OS-level consent sheet.
        NSCameraUsageDescription: Qwave asks for the camera only when a website you are visiting requests it, such as for a video call.
        NSMicrophoneUsageDescription: Qwave asks for the microphone only when a website you are visiting requests it, such as for a call or voice input.
        NSLocationWhenInUseUsageDescription: Qwave shares your location only when a website you are visiting requests it, such as for maps or local search.
        # MusicKit: reading Apple Music subscription status and the system
        # player's now-playing state for the toolbar HUD. Requested only when
        # you open the HUD for the first time — see docs/MUSIC.md.
        NSAppleMusicUsageDescription: Qwave shows what's playing in Apple Music in the toolbar. This only reads playback status — Qwave never streams or stores music.
        LSApplicationCategoryType: public.app-category.productivity
        # Register Qwave as an http/https handler so macOS lists it as a
        # candidate default browser (System Settings, or the in-app "Set Qwave
        # as Default Browser" action -> NSWorkspace.setDefaultApplication).
        # macOS needs no entitlement for this: the scheme declaration plus a
        # runtime call is sufficient. (com.apple.developer.web-browser is an
        # iOS-only requirement and is deliberately not used here.)
        CFBundleURLTypes:
          - CFBundleURLName: is.8b.qwave.web
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - http
              - https
          # qwave:// — deep links (open "qwave://example.com") and
          # automation; see Sources/QwaveApp/QwaveURL.swift.
          - CFBundleURLName: is.8b.qwave
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - qwave
        # Handoff: advertise the active tab so browsing can resume on another
        # device. The window controller only ever hands off non-private,
        # non-ephemeral http(s) pages — see HandoffPolicy.
        NSUserActivityTypes:
          - NSUserActivityTypeBrowsingWeb
        # Sparkle 2 auto-updates: appcast lives on GitHub Releases; updates are
        # EdDSA-signed in CI (see .github/workflows/release.yml and docs/SIGNING.md).
        # SUEnableAutomaticChecks is deliberately NOT set: Sparkle asks the
        # user for permission before any background checking — a privacy-first
        # browser does not phone home without consent.
        SUFeedURL: https://github.com/8b-is/qwave/releases/latest/download/appcast.xml
        SUPublicEDKey: Lk/fBirUE+oEowMO599Wgr1X2C1XBPcWBJExkkHwG48=
    entitlements:
      path: Resources/Qwave/Qwave.entitlements
      properties:
        # Enforced only when the user signs with their team ID — see docs/SIGNING.md.
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider-systemextension
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.is.8b.qwave
        keychain-access-groups:
          - $(TeamIdentifierPrefix)is.8b.qwave.shared
        # Now Playing HUD: read Apple Music subscription + system player
        # state (docs/MUSIC.md). No catalog playback, no library writes.
        com.apple.developer.musickit: true

  PacketTunnel:
    type: system-extension
    platform: macOS
    sources:
      - path: Sources/PacketTunnel
      - path: zig-core/include
        headerVisibility: public
    dependencies:
      - package: QwaveKit
        product: QwaveTunnelKit
      - package: WireGuardKit
        product: WireGuardKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: is.8b.qwave.tunnel
        PRODUCT_NAME: PacketTunnel
        PROVISIONING_PROFILE_SPECIFIER: "$(QWAVE_TUNNEL_PROVISIONING_PROFILE)"
        # libwg-go.a is produced into BUILT_PRODUCTS_DIR by the pre-build
        # make step; WireGuardKitGo links it via -lwg-go.
        # libqpacket.a is produced by the Zig pre-build script below.
        LIBRARY_SEARCH_PATHS: "$(inherited) $(BUILT_PRODUCTS_DIR)"
        OTHER_LDFLAGS: "$(inherited) -lqpacket"
    preBuildScripts:
      - name: Build WireGuard Go Bridge
        shell: /bin/bash
        script: |
          set -euo pipefail
          if ! command -v go >/dev/null 2>&1 && [ ! -x /opt/homebrew/bin/go ] && [ ! -x /usr/local/bin/go ]; then
            echo "error: Go toolchain not found — WireGuardKitGo needs it (brew install go)" >&2
            exit 1
          fi
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          derived_data="${BUILD_DIR%%/Build/*}"
          wg_go_dir="${PROJECT_DIR}/Packages/WireGuardKit/Sources/WireGuardKitGo"
          if [ ! -d "${wg_go_dir}" ]; then
            wg_go_dir="${derived_data}/SourcePackages/checkouts/wireguard-apple/Sources/WireGuardKitGo"
          fi
          if [ ! -d "${wg_go_dir}" ]; then
            echo "error: WireGuardKitGo checkout not found at ${wg_go_dir}" >&2
            exit 1
          fi
          make -C "${wg_go_dir}" build
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/libwg-go.a
      - name: Build Zig packet filter
        shell: /bin/bash
        script: |
          set -euo pipefail
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          if ! command -v zig >/dev/null 2>&1; then
            echo "error: Zig not found — install with: brew install zig" >&2
            exit 1
          fi
          cd "${PROJECT_DIR}/zig-core"
          # Build one static-library slice per architecture xcodebuild asked
          # for, then lipo them into the universal libqpacket.a the linker
          # expects. Release builds are universal (arm64 + x86_64); a single
          # aarch64 archive fails to link the x86_64 slice.
          slices=()
          for arch in ${ARCHS:-arm64}; do
            case "$arch" in
              arm64)  ztarget="aarch64-macos" ;;
              x86_64) ztarget="x86_64-macos" ;;
              *) echo "error: unsupported arch '$arch' for zig packet filter" >&2; exit 1 ;;
            esac
            zig_a="${BUILT_PRODUCTS_DIR}/libqpacket-${arch}.zig.a"
            # -fcompiler-rt bundles Zig's compiler runtime into the archive.
            # Without it the x86_64 slice leaves ___zig_probe_stack (and any
            # other compiler-rt builtin) undefined at link time, since it links
            # into a non-Zig binary that provides no Zig runtime.
            zig build-lib src/packet.zig -O ReleaseSafe -target "$ztarget" -fcompiler-rt -femit-bin="$zig_a"
            # Zig's archiver emits members that Apple's newer ld (Xcode 16.3+)
            # rejects as "not 8-byte aligned". Re-pack the extracted objects with
            # Apple's libtool, which aligns them correctly. Works on every
            # toolchain, so it is a strict improvement over shipping zig's archive.
            work="${BUILT_PRODUCTS_DIR}/qpacket-${arch}.objs"
            rm -rf "$work"; mkdir -p "$work"
            ( cd "$work" && ar x "$zig_a" )
            # Zig stores archive members mode 0000; make them readable for libtool.
            chmod u+rw "$work"/*.o
            out="${BUILT_PRODUCTS_DIR}/libqpacket-${arch}.a"
            rm -f "$out"
            xcrun libtool -static -o "$out" "$work"/*.o
            slices+=("$out")
          done
          lipo -create "${slices[@]}" -output "${BUILT_PRODUCTS_DIR}/libqpacket.a"
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/libqpacket.a
    info:
      path: Resources/PacketTunnel/Info.plist
      properties:
        CFBundleName: PacketTunnel
        CFBundleDisplayName: Qwave VPN Tunnel
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "10000"
        NetworkExtension:
          NEMachServiceName: $(TeamIdentifierPrefix)group.is.8b.qwave.tunnel
          NEProviderClasses:
            com.apple.networkextension.packet-tunnel: PacketTunnel.PacketTunnelProvider
    entitlements:
      path: Resources/PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider-systemextension
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.is.8b.qwave
        keychain-access-groups:
          - $(TeamIdentifierPrefix)is.8b.qwave.shared

  CredentialProvider:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/CredentialProvider
    dependencies:
      # Crypto-free slim product ONLY. The extension must never link VPNKit /
      # the ML-KEM stack (docs/AUTOFILL.md § Separation from DeviceKeyManager).
      - package: QwaveKit
        product: WebCredentials
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: is.8b.qwave.autofill
        PRODUCT_NAME: CredentialProvider
        PROVISIONING_PROFILE_SPECIFIER: "$(QWAVE_AUTOFILL_PROVISIONING_PROFILE)"
    info:
      path: Resources/CredentialProvider/Info.plist
      properties:
        CFBundleName: CredentialProvider
        CFBundleDisplayName: Qwave Passwords
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "10000"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesPasskeys: true
    entitlements:
      path: Resources/CredentialProvider/CredentialProvider.entitlements
      properties:
        # Enforced only when signed with a real team id (same posture as the VPN
        # entitlements; CI builds CODE_SIGNING_ALLOWED=NO). See docs/SIGNING.md.
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.is.8b.qwave
        keychain-access-groups:
          - $(TeamIdentifierPrefix)is.8b.qwave.shared

schemes:
  Qwave:
    build:
      targets:
        Qwave: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
