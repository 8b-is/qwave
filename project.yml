name: Qwave

options:
  bundleIdPrefix: is.8b
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: CKQ9Q43ANM
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  QwaveKit:
    path: Packages/QwaveKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # 2.9.5, pinned by commit: the update framework is a trust anchor, and a
    # moved tag must not be able to change what we embed. The SPM binary
    # artifact is additionally checksum-verified by SwiftPM itself.
    revision: 79bc9e872948e47877e76f194cb0c8e0412b0b90

targets:
  Qwave:
    type: application
    platform: macOS
    sources:
      - path: Sources/QwaveApp
      - path: Resources/Qwave/Assets.xcassets
    dependencies:
      - package: QwaveKit
        product: QwaveKit
      - package: QwaveKit
        product: WebCredentials
      - package: Sparkle
      - target: CredentialProvider
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: is.8b.qwave
        PRODUCT_NAME: Qwave
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: "$(QWAVE_APP_PROVISIONING_PROFILE)"
        # Feature channel: stable leaves WebKit defaults; the QwaveNightly
        # scheme sets this to nightly (every experimental feature ON).
        QWAVE_CHANNEL: stable
        # The sovereign core: a zero-dependency Rust staticlib, built by the
        # pre-build script below and force-loaded so EVERY decision surface —
        # egress, mem8 waves, Phoenix, telemetry — is present in the binary,
        # not just the members some call site happened to reference. The
        # Swift bridge speaks its C ABI through QwaveKit's SovereignCore
        # module (RustCoreABI carries the header + weak stubs).
        OTHER_LDFLAGS: "$(inherited) -force_load $(SRCROOT)/core/target/apple/$(PLATFORM_NAME)/libqwave_core.a"
    preBuildScripts:
      - name: Build the Rust core (cargo)
        shell: /bin/bash
        script: |
          set -euo pipefail
          bash "${PROJECT_DIR}/core/build-apple.sh"
        outputFiles:
          - $(SRCROOT)/core/target/apple/$(PLATFORM_NAME)/libqwave_core.a
    info:
      path: Resources/Qwave/Info.plist
      properties:
        CFBundleName: Qwave
        CFBundleDisplayName: Qwave
        QWAVE_CHANNEL: $(QWAVE_CHANNEL)
        CFBundleShortVersionString: "2.0.2"
        # major*10000 + minor*100 + patch — Sparkle compares this value, and
        # CI enforces the mapping against the release tag.
        CFBundleVersion: "20002"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # Browsers load arbitrary user-chosen web content; ATS is relaxed for
        # web content only (app-level URLSession traffic stays ATS-enforced).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        # TCC purpose strings for web content: WebKit routes getUserMedia and the
        # Geolocation API through the app's usage descriptions. Without these keys
        # the first camera/mic/location request hard-kills the process. Access is
        # still gated per-origin by the in-app prompt (see WebPermissionArbiter);
        # these strings only explain the OS-level consent sheet.
        NSCameraUsageDescription: Qwave asks for the camera only when a website you are visiting requests it, such as for a video call.
        NSMicrophoneUsageDescription: Qwave asks for the microphone only when a website you are visiting requests it, such as for a call or voice input.
        NSLocationWhenInUseUsageDescription: Qwave shares your location only when a website you are visiting requests it, such as for maps or local search.
        LSApplicationCategoryType: public.app-category.productivity
        # Register Qwave as an http/https handler so macOS lists it as a
        # candidate default browser (System Settings, or the in-app "Set Qwave
        # as Default Browser" action -> NSWorkspace.setDefaultApplication).
        # macOS needs no entitlement for this: the scheme declaration plus a
        # runtime call is sufficient. (com.apple.developer.web-browser is an
        # iOS-only requirement and is deliberately not used here.)
        CFBundleURLTypes:
          - CFBundleURLName: is.8b.qwave.web
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - http
              - https
          # qwave:// — deep links (open "qwave://example.com") and
          # automation; see Sources/QwaveApp/QwaveURL.swift.
          - CFBundleURLName: is.8b.qwave
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - qwave
        # Handoff: advertise the active tab so browsing can resume on another
        # device. The window controller only ever hands off non-private,
        # non-ephemeral http(s) pages — see HandoffPolicy.
        NSUserActivityTypes:
          - NSUserActivityTypeBrowsingWeb
        # Sparkle 2 auto-updates: appcast lives on GitHub Releases; updates are
        # EdDSA-signed in CI (see .github/workflows/release.yml and docs/SIGNING.md).
        # SUEnableAutomaticChecks is deliberately NOT set: Sparkle asks the
        # user for permission before any background checking — a privacy-first
        # browser does not phone home without consent.
        SUFeedURL: https://github.com/8b-is/qwave/releases/latest/download/appcast.xml
        SUPublicEDKey: Lk/fBirUE+oEowMO599Wgr1X2C1XBPcWBJExkkHwG48=
    entitlements:
      path: Resources/Qwave/Qwave.entitlements
      properties:
        # Enforced only when the user signs with their team ID — see docs/SIGNING.md.
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider-systemextension
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.is.8b.qwave
        keychain-access-groups:
          - $(TeamIdentifierPrefix)is.8b.qwave.shared

  # Read-only MCP server over Qwave's persisted state, spoken over stdio.
  #
  # Deliberately NOT a dependency of the Qwave app and NOT embedded in its
  # bundle. Shipping the binary inside every install would put a
  # history-reading executable on disk for users who never asked for the
  # surface; the feature is opt-in (SettingsStore.mcpServerEnabled, default
  # OFF), and so is having the tool at all. Build it explicitly, or with
  # `swift build --package-path Packages/QwaveKit --product qwave-mcp`.
  QwaveMCP:
    type: tool
    platform: macOS
    sources:
      - path: Packages/QwaveKit/Sources/QwaveMCP
    dependencies:
      - package: QwaveKit
        product: MCPSurface
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: is.8b.qwave.mcp
        PRODUCT_NAME: qwave-mcp

  CredentialProvider:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/CredentialProvider
    dependencies:
      # Crypto-free slim product ONLY. The extension must never link VPNKit /
      # the ML-KEM stack (docs/AUTOFILL.md § Separation from DeviceKeyManager).
      - package: QwaveKit
        product: WebCredentials
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: is.8b.qwave.autofill
        PRODUCT_NAME: CredentialProvider
        PROVISIONING_PROFILE_SPECIFIER: "$(QWAVE_AUTOFILL_PROVISIONING_PROFILE)"
    info:
      path: Resources/CredentialProvider/Info.plist
      properties:
        CFBundleName: CredentialProvider
        CFBundleDisplayName: Qwave Passwords
        CFBundleShortVersionString: "2.0.2"
        CFBundleVersion: "20002"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesPasskeys: true
    entitlements:
      path: Resources/CredentialProvider/CredentialProvider.entitlements
      properties:
        # Enforced only when signed with a real team id (same posture as the VPN
        # entitlements; CI builds CODE_SIGNING_ALLOWED=NO). See docs/SIGNING.md.
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.is.8b.qwave
        keychain-access-groups:
          - $(TeamIdentifierPrefix)is.8b.qwave.shared

  # The iPhone lane: the same sovereign core (WebKit + QwaveKit shields,
  # containers, feature flags, AND the Rust core — mem8, Phoenix, egress,
  # telemetry) in a SwiftUI shell. Minimum device: iPhone 13 (iOS 15).
  # No AppKit, no Sparkle — those are desktop lanes.
  QwaveIOS:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/QwaveIOS
      - path: Resources/QwaveIOS/Assets.xcassets
    dependencies:
      - package: QwaveKit
        product: QwaveKit
    preBuildScripts:
      - name: Build the Rust core for iOS (cargo)
        shell: /bin/bash
        script: |
          set -euo pipefail
          bash "${PROJECT_DIR}/core/build-apple.sh"
        outputFiles:
          - $(SRCROOT)/core/target/apple/$(PLATFORM_NAME)/libqwave_core.a
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: is.8b.qwave.ios
        PRODUCT_NAME: Qwave
        QWAVE_CHANNEL: stable
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The same sovereign core the desktop app links, force-loaded: every
        # decision surface (egress, mem8, Phoenix, telemetry) is present in
        # the binary. The strong Rust definitions replace the RustCoreABI
        # weak stubs at link time.
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/core/target/apple/$(PLATFORM_NAME)"
        OTHER_LDFLAGS: "$(inherited) -force_load $(SRCROOT)/core/target/apple/$(PLATFORM_NAME)/libqwave_core.a"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        INFOPLIST_KEY_CFBundleDisplayName: Qwave
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    info:
      path: Resources/QwaveIOS/Info.plist
      properties:
        CFBundleShortVersionString: "2.0.2"
        CFBundleVersion: "20002"
        LSRequiresIPhoneOS: true

schemes:
  Qwave:
    build:
      targets:
        Qwave: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
  QwaveNightly:
    build:
      targets:
        Qwave: all
    run:
      config: Debug
      # The scheme cannot set build settings (xcodegen drops them), so the
      # nightly channel travels two real paths: this environment variable for
      # GUI runs, and the QWAVE_CHANNEL=nightly build-setting override in
      # tools/install-nightly.sh (which lands in Info.plist and in the cargo
      # pre-build script's environment).
      environmentVariables:
        QWAVE_CHANNEL: nightly
    test:
      config: Debug
    archive:
      config: Release
  QwaveMCP:
    build:
      targets:
        QwaveMCP: all
    run:
      config: Debug
    archive:
      config: Release
  QwaveIOS:
    build:
      targets:
        QwaveIOS: all
    run:
      config: Debug
    archive:
      config: Release
