name: Qwave

options:
  bundleIdPrefix: is.8b
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  QwaveKit:
    path: Packages/QwaveKit
  WireGuardKit:
    path: Packages/WireGuardKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # 2.9.5, pinned by commit: the update framework is a trust anchor, and a
    # moved tag must not be able to change what we embed. The SPM binary
    # artifact is additionally checksum-verified by SwiftPM itself.
    revision: 79bc9e872948e47877e76f194cb0c8e0412b0b90

targets:
  Qwave:
    type: application
    platform: macOS
    sources:
      - path: Sources/QwaveApp
    dependencies:
      - package: QwaveKit
        product: QwaveKit
      - package: Sparkle
      - target: PacketTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: is.8b.qwave
        PRODUCT_NAME: Qwave
    info:
      path: Resources/Qwave/Info.plist
      properties:
        CFBundleName: Qwave
        CFBundleDisplayName: Qwave
        CFBundleShortVersionString: "0.4.4"
        # major*10000 + minor*100 + patch — Sparkle compares this value, and
        # CI enforces the mapping against the release tag.
        CFBundleVersion: "404"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # Browsers load arbitrary user-chosen web content; ATS is relaxed for
        # web content only (app-level URLSession traffic stays ATS-enforced).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        LSApplicationCategoryType: public.app-category.productivity
        # Sparkle 2 auto-updates: appcast lives on GitHub Releases; updates are
        # EdDSA-signed in CI (see .github/workflows/release.yml and docs/SIGNING.md).
        # SUEnableAutomaticChecks is deliberately NOT set: Sparkle asks the
        # user for permission before any background checking — a privacy-first
        # browser does not phone home without consent.
        SUFeedURL: https://github.com/8b-is/qwave/releases/latest/download/appcast.xml
        SUPublicEDKey: Lk/fBirUE+oEowMO599Wgr1X2C1XBPcWBJExkkHwG48=
    entitlements:
      path: Resources/Qwave/Qwave.entitlements
      properties:
        # Enforced only when the user signs with their team ID — see docs/SIGNING.md.
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider-systemextension
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.is.8b.qwave
        keychain-access-groups:
          - $(TeamIdentifierPrefix)is.8b.qwave.shared

  PacketTunnel:
    type: system-extension
    platform: macOS
    sources:
      - path: Sources/PacketTunnel
      - path: zig-core/include
        headerVisibility: public
    dependencies:
      - package: QwaveKit
        product: QwaveTunnelKit
      - package: WireGuardKit
        product: WireGuardKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: is.8b.qwave.tunnel
        PRODUCT_NAME: PacketTunnel
        # libwg-go.a is produced into BUILT_PRODUCTS_DIR by the pre-build
        # make step; WireGuardKitGo links it via -lwg-go.
        # libqpacket.a is produced by the Zig pre-build script below.
        LIBRARY_SEARCH_PATHS: "$(inherited) $(BUILT_PRODUCTS_DIR)"
        OTHER_LDFLAGS: "$(inherited) -lqpacket"
    preBuildScripts:
      - name: Build WireGuard Go Bridge
        shell: /bin/bash
        script: |
          set -euo pipefail
          if ! command -v go >/dev/null 2>&1 && [ ! -x /opt/homebrew/bin/go ] && [ ! -x /usr/local/bin/go ]; then
            echo "error: Go toolchain not found — WireGuardKitGo needs it (brew install go)" >&2
            exit 1
          fi
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          derived_data="${BUILD_DIR%%/Build/*}"
          wg_go_dir="${PROJECT_DIR}/Packages/WireGuardKit/Sources/WireGuardKitGo"
          if [ ! -d "${wg_go_dir}" ]; then
            wg_go_dir="${derived_data}/SourcePackages/checkouts/wireguard-apple/Sources/WireGuardKitGo"
          fi
          if [ ! -d "${wg_go_dir}" ]; then
            echo "error: WireGuardKitGo checkout not found at ${wg_go_dir}" >&2
            exit 1
          fi
          make -C "${wg_go_dir}" build
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/libwg-go.a
      - name: Build Zig packet filter
        shell: /bin/bash
        script: |
          set -euo pipefail
          if ! command -v zig >/dev/null 2>&1; then
            echo "error: Zig not found — install with: brew install zig" >&2
            exit 1
          fi
          cd "${PROJECT_DIR}/zig-core"
          # Build one static-library slice per architecture xcodebuild asked
          # for, then lipo them into the universal libqpacket.a the linker
          # expects. Release builds are universal (arm64 + x86_64); a single
          # aarch64 archive fails to link the x86_64 slice.
          slices=()
          for arch in ${ARCHS:-arm64}; do
            case "$arch" in
              arm64)  ztarget="aarch64-macos" ;;
              x86_64) ztarget="x86_64-macos" ;;
              *) echo "error: unsupported arch '$arch' for zig packet filter" >&2; exit 1 ;;
            esac
            out="${BUILT_PRODUCTS_DIR}/libqpacket-${arch}.a"
            # -fcompiler-rt bundles Zig's compiler runtime into the archive.
            # Without it the x86_64 slice leaves ___zig_probe_stack (and any
            # other compiler-rt builtin) undefined at link time, since it links
            # into a non-Zig binary that provides no Zig runtime.
            zig build-lib src/packet.zig -O ReleaseSafe -target "$ztarget" -fcompiler-rt -femit-bin="$out"
            slices+=("$out")
          done
          lipo -create "${slices[@]}" -output "${BUILT_PRODUCTS_DIR}/libqpacket.a"
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/libqpacket.a
    info:
      path: Resources/PacketTunnel/Info.plist
      properties:
        CFBundleName: PacketTunnel
        CFBundleDisplayName: Qwave VPN Tunnel
        CFBundleShortVersionString: "0.4.4"
        CFBundleVersion: "404"
        NetworkExtension:
          NEMachServiceName: $(TeamIdentifierPrefix)group.is.8b.qwave.tunnel
          NEProviderClasses:
            com.apple.networkextension.packet-tunnel: PacketTunnel.PacketTunnelProvider
    entitlements:
      path: Resources/PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider-systemextension
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.is.8b.qwave
        keychain-access-groups:
          - $(TeamIdentifierPrefix)is.8b.qwave.shared

schemes:
  Qwave:
    build:
      targets:
        Qwave: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
