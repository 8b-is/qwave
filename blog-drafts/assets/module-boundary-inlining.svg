<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text {
        font-family: monospace;
        font-size: 11px;
        fill: #e5e7eb;
      }
      .label {
        font-size: 10px;
      }
    </style>
  </defs>
  <rect width="720" height="300" fill="#0d1117"/>
  
  <!-- Module A: BrowserCore -->
  <rect x="60" y="80" width="240" height="140" rx="8" fill="#1a1f29" stroke="#2dd4bf" stroke-width="2"/>
  <text x="180" y="60" text-anchor="middle" font-weight="bold">Module A: BrowserCore</text>
  <rect x="100" y="120" width="160" height="40" rx="4" fill="#0d1117" stroke="#2dd4bf" stroke-width="1"/>
  <text x="180" y="145" text-anchor="middle">OmniboxSuggester.suggestions</text>
  
  <!-- Module B: Benchmarks -->
  <rect x="420" y="80" width="240" height="140" rx="8" fill="#1a1f29" stroke="#2dd4bf" stroke-width="2"/>
  <text x="540" y="60" text-anchor="middle" font-weight="bold">Module B: Benchmarks</text>
  <rect x="460" y="120" width="160" height="40" rx="4" fill="#0d1117" stroke="#2dd4bf" stroke-width="1"/>
  <text x="540" y="145" text-anchor="middle">caller</text>
  
  <!-- TOP PATH: WITH @inlinable -->
  <path d="M 300 150 L 420 150" stroke="#10b981" stroke-width="2" fill="none"/>
  <polygon points="420,150 410,145 410,155" fill="#10b981"/>
  <text x="360" y="140" text-anchor="middle" class="label">WITH @inlinable:</text>
  <text x="360" y="152" text-anchor="middle" class="label">body baked into ABI, B inlines it</text>
  
  <!-- BOTTOM PATH: WITHOUT -->
  <path d="M 300 190 L 420 190" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2" fill="none"/>
  <polygon points="420,190 410,185 410,195" fill="#f59e0b"/>
  <text x="360" y="205" text-anchor="middle" class="label">WITHOUT:</text>
  <text x="360" y="217" text-anchor="middle" class="label">B calls through a symbol; body stays private to A</text>
  
  <!-- Bottom annotation -->
  <text x="360" y="280" text-anchor="middle" fill="#22d3ee" font-size="11">
    measured cost of the boundary: 0% on malloc/retain/release
  </text>
</svg>