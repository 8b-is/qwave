    <text x="20" y="24" text-anchor="middle" fill="#0d1117" font-family="monospace" font-size="12" font-weight="bold">3</text>
    <text x="80" y="25" text-anchor="middle" fill="#e5e7eb" font-family="monospace" font-size="12" font-weight="bold">WKContentRuleListStore</text>
