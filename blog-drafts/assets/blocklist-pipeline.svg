    <text x="20" y="24" text-anchor="middle" fill="#0d1117" font-family="monospace" font-size="12" font-weight="bold">2</text>
    <text x="80" y="25" text-anchor="middle" fill="#e5e7eb" font-family="monospace" font-size="12" font-weight="bold">7.5 MB JSON</text>
    <text x="80" y="42" text-anchor="middle" fill="#e5e7eb" font-family="monospace" font-size="10">(bundled)</text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 440 110 L 464 110" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  
  <!-- Stage 3 -->
