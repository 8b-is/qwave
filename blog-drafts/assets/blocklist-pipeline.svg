    <text x="80" y="42" text-anchor="middle" fill="#e5e7eb" font-family="monospace" font-size="10">(EasyList)</text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 220 110 L 244 110" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
  
  <!-- Stage 2 -->
