<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="300" fill="#0d1117"/>
  
  <!-- Left: App process -->
  <rect x="40" y="120" width="140" height="60" rx="4" fill="none" stroke="#2dd4bf" stroke-width="2"/>
  <text x="110" y="100" text-anchor="middle" fill="#e5e7eb" font-family="monospace" font-size="12">Qwave app process</text>
  
  <!-- Right: Three WebContent processes -->
  <g id="webcontent-group">
    <rect x="320" y="40" width="360" height="220" rx="6" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="500" y="30" text-anchor="middle" fill="#e5e7eb" font-family="monospace" font-size="12">out-of-process — memory the app does not own</text>
    
    <!-- Process 1 -->
    <rect x="360" y="80" width="100" height="140" rx="4" fill="none" stroke="#9ca3af" stroke-width="2"/>
    <text x="410" y="70" text-anchor="middle" fill="#e5e7eb" font-family="monospace" font-size="12">com.apple.WebKit.WebContent</text>
    <text x="410" y="90" text-anchor="middle" fill="#e5e7eb" font-family="monospace" font-size="11">process 1</text>
    <text x="410" y="180" text-anchor="middle" fill="#e5e7eb" font-family="monospace" font-size="11">footprint</text>
    <text x="410" y="195" text-anchor="middle" fill="#e5e7eb" font-family="monospace" font-size="11">45.7 MB</text>
    
    <!-- Process 2 -->
    <rect x="480" y="80" width="100" height="140" rx="4" fill="none" stroke="#9ca3af" stroke-width="2"/>
    <text x="530" y="70" text-anchor="middle" fill="#e5e7eb" font-family="monospace" font-size="12">com.apple.WebKit.WebContent</text>
    <text x="530" y="90" text-anchor="middle" fill="#e5e7eb" font-family="monospace" font-size="11">process 2</text>
    <text x="530" y="180" text-anchor="middle" fill="#e5e7eb" font-family="monospace" font-size="11">footprint</text>
    <text x="530" y="195" text-anchor="middle" fill="#e5e7eb" font-family="monospace" font-size="11">45.7 MB</text>
    
    <!-- Process 3 -->
    <rect x="600" y="80" width="100" height="140" rx="4" fill="none" stroke="#9ca3af" stroke-width="2"/>
    <text x="650" y="70" text-anchor="middle" fill="#e5e7eb" font-family="monospace" font-size="12">com.apple.WebKit.WebContent</text>
    <text x="650" y="90" text-anchor="middle" fill="#e5e7eb" font-family="monospace" font-size="11">process 3</text>
    <text x="650" y="180" text-anchor="middle" fill="#e5e7eb" font-family="monospace" font-size="11">footprint</text>
    <text x="650" y="195" text-anchor="middle" fill="#e5e7eb" font-family="monospace" font-size="11">45.7 MB</text>
  </g>
  
  <!-- Red dashed line with label -->
  <path d="M180 150 L320 150" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>
  <text x="250" y="145" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="12">in-process tools (heap, vmmap, task_info) see ONLY the app box</text>
</svg>