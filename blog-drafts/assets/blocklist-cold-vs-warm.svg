<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" style="font-family: monospace; font-size: 13px;">
  <rect width="640" height="300" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="320" y="30" fill="#9ca3af" text-anchor="middle" font-size="13">59,657 rules: cold compile vs warm load</text>
  
  <!-- Y-axis labels -->
  <text x="20" y="90" fill="#9ca3af" text-anchor="start">Cold compile (first launch)</text>
  <text x="20" y="140" fill="#9ca3af" text-anchor="start">Warm load (relaunch, cache hit)</text>
  
  <!-- Scale line -->
  <line x1="200" y1="70" x2="200" y2="170" stroke="#9ca3af" stroke-width="1" opacity="0.5"/>
  
  <!-- Scale markers and labels -->
  <line x1="200" y1="70" x2="195" y2="70" stroke="#9ca3af" stroke-width="1"/>
  <text x="190" y="73" fill="#9ca3af" text-anchor="end">0</text>
  
  <line x1="400" y1="70" x2="395" y2="70" stroke="#9ca3af" stroke-width="1"/>
  <text x="390" y="73" fill="#9ca3af" text-anchor="end">1.42</text>
  
  <line x1="600" y1="70" x2="595" y2="70" stroke="#9ca3af" stroke-width="1"/>
  <text x="590" y="73" fill="#9ca3af" text-anchor="end">2.84</text>
  
  <text x="400" y="60" fill="#9ca3af" text-anchor="middle" font-size="11">seconds</text>
  
  <!-- Bars -->
  <!-- Cold compile bar -->
  <rect x="200" y="75" width="400" height="30" fill="#ef4444" rx="2"/>
  <text x="610" y="95" fill="#ef4444" text-anchor="end">2.84 s</text>
  
  <!-- Warm load bar -->
  <rect x="200" y="125" width="19" height="30" fill="#10b981" rx="2"/>
  <text x="225" y="145" fill="#10b981" text-anchor="start">0.135 s</text>
  
  <!-- Arrow and annotation -->
  <line x1="600" y1="105" x2="219" y2="140" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,2"/>
  <polygon points="219,140 224,138 222,140 224,142" fill="#06b6d4"/>
  <text x="410" y="120" fill="#06b6d4" text-anchor="middle">-95%</text>
</svg>