<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text {
        font-family: 'Roboto Mono', monospace;
        font-size: 12px;
        fill: #e5e7eb;
      }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="dashed-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#0d1117"/>
  
  <!-- Top row: App launch -->
  <rect x="60" y="60" width="140" height="60" rx="8" fill="#1a1f29" stroke="#2dd4bf" stroke-width="2"/>
  <text x="130" y="95" text-anchor="middle" font-weight="500">App launch</text>
  
  <!-- Arrow to decision -->
  <line x1="200" y1="90" x2="260" y2="90" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Decision diamond: Previous version compiled? -->
  <path d="M 310 90 L 350 60 L 390 90 L 350 120 Z" fill="#1a1f29" stroke="#2dd4bf" stroke-width="2"/>
  <text x="350" y="95" text-anchor="middle" font-weight="500">Previous version</text>
  <text x="350" y="110" text-anchor="middle" font-weight="500">compiled?</text>
  
  <!-- Green branch (yes) -->
  <text x="430" y="75" text-anchor="middle" fill="#10b981" font-weight="500">yes</text>
  <line x1="390" y1="90" x2="450" y2="90" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="460" y="60" width="200" height="60" rx="8" fill="#1a1f29" stroke="#10b981" stroke-width="2"/>
  <text x="560" y="85" text-anchor="middle">Serve stale list immediately</text>
  <text x="560" y="100" text-anchor="middle">(~135 ms)</text>
  
  <!-- Red branch (no) -->
  <text x="350" y="170" text-anchor="middle" fill="#ef4444" font-weight="500">no, true first launch</text>
  <line x1="350" y1="120" x2="350" y2="200" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="260" y="210" width="180" height="60" rx="8" fill="#1a1f29" stroke="#ef4444" stroke-width="2"/>
  <text x="350" y="235" text-anchor="middle">Wait for full compile</text>
  <text x="350" y="250" text-anchor="middle">(~2.8 s)</text>
  
  <!-- Background compile box (dashed cyan) -->
  <rect x="460" y="150" width="240" height="60" rx="8" fill="#1a1f29" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="580" y="175" text-anchor="middle" fill="#22d3ee">Compile fresh 59k rules in background</text>
  <text x="580" y="190" text-anchor="middle" fill="#22d3ee">(~2.8 s)</text>
  
  <!-- Dashed arrow from green branch to background compile -->
  <line x1="560" y1="120" x2="560" y2="150" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#dashed-arrowhead)"/>
  
  <!-- Label for dashed arrow -->
  <text x="580" y="140" text-anchor="middle" fill="#22d3ee" font-size="11">swap on callback, remove old artifact</text>
</svg>