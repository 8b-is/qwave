<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0d1117"/>
  
  <g font-family="monospace" font-size="11" fill="#e5e7eb">
    <!-- Title -->
    <text x="340" y="30" text-anchor="middle" font-size="14" fill="#e5e7eb">
      OmniboxSuggester (500 entries): @inlinable vs not
    </text>
    
    <!-- Δ = 0% annotation -->
    <text x="340" y="60" text-anchor="middle" font-size="18" fill="#2dd4bf" font-weight="bold">
      Δ = 0%
    </text>
    
    <!-- Y-axis label -->
    <text x="40" y="180" text-anchor="middle" transform="rotate(-90, 40, 180)" fill="#9ca3af">
      Count (identical values)
    </text>
    
    <!-- Legend -->
    <g transform="translate(340, 280)">
      <rect x="-80" y="-8" width="10" height="10" fill="#ef4444"/>
      <text x="-65" y="2">WITH @inlinable</text>
      <rect x="50" y="-8" width="10" height="10" fill="#9ca3af"/>
      <text x="65" y="2">WITHOUT</text>
    </g>
    
    <!-- Metric groups -->
    <g fill="#9ca3af" text-anchor="middle">
      <text x="170" y="270">mallocCountTotal (1,011)</text>
      <text x="340" y="270">retainCount (6,536)</text>
      <text x="510" y="270">releaseCount (7,554)</text>
    </g>
    
    <!-- Bars for mallocCountTotal -->
    <g transform="translate(170, 220)">
      <rect x="-30" y="-150" width="20" height="150" fill="#ef4444"/>
      <rect x="-10" y="-150" width="20" height="150" fill="#9ca3af"/>
      <text x="-20" y="-160" text-anchor="middle" fill="#e5e7eb">1,011</text>
    </g>
    
    <!-- Bars for retainCount -->
    <g transform="translate(340, 220)">
      <rect x="-30" y="-150" width="20" height="150" fill="#ef4444"/>
      <rect x="-10" y="-150" width="20" height="150" fill="#9ca3af"/>
      <text x="-20" y="-160" text-anchor="middle" fill="#e5e7eb">6,536</text>
    </g>
    
    <!-- Bars for releaseCount -->
    <g transform="translate(510, 220)">
      <rect x="-30" y="-150" width="20" height="150" fill="#ef4444"/>
      <rect x="-10" y="-150" width="20" height="150" fill="#9ca3af"/>
      <text x="-20" y="-160" text-anchor="middle" fill="#e5e7eb">7,554</text>
    </g>
    
    <!-- X-axis line -->
    <line x1="60" y1="220" x2="620" y2="220" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Y-axis line -->
    <line x1="60" y1="220" x2="60" y2="70" stroke="#9ca3af" stroke-width="1"/>
  </g>
</svg>