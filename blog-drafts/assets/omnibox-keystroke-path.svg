<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Omnibox keystroke path: key press, parse, history query, rank, dropdown, with before and after allocation counts">
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- legend -->
  <rect x="20" y="14" width="10" height="10" rx="2" fill="#dc2626"/>
  <text x="36" y="23" font-size="11" fill="#6b7280">before</text>
  <rect x="96" y="14" width="10" height="10" rx="2" fill="#059669"/>
  <text x="112" y="23" font-size="11" fill="#6b7280">after</text>
  <text x="158" y="23" font-size="11" fill="#6b7280">mallocs per iteration</text>

  <text x="480" y="48" font-size="13" fill="#dc2626" text-anchor="middle">before &#8776; 4,800&#8211;5,030 allocations per keystroke</text>

  <!-- nodes -->
  <g fill="none" stroke="#9ca3af" stroke-width="1.5" rx="12">
    <rect x="10"  y="80" width="120" height="72" rx="12"/>
    <rect x="180" y="80" width="170" height="72" rx="12"/>
    <rect x="400" y="80" width="190" height="72" rx="12"/>
    <rect x="630" y="80" width="180" height="72" rx="12"/>
    <rect x="850" y="80" width="100" height="72" rx="12"/>
  </g>

  <g text-anchor="middle">
    <text x="70"  y="112" font-size="13" font-weight="600" fill="#374151">Key press</text>
    <text x="70"  y="130" font-size="10" fill="#6b7280">controlTextDidChange</text>

    <text x="265" y="112" font-size="13" font-weight="600" fill="#374151">OmniboxParser.parse</text>
    <text x="265" y="130" font-size="10" fill="#6b7280">WHATWG / WebURL</text>

    <text x="495" y="106" font-size="12" font-weight="600" fill="#374151">HistoryStore</text>
    <text x="495" y="121" font-size="12" font-weight="600" fill="#374151">.entries(matching:)</text>
    <text x="495" y="138" font-size="10" fill="#6b7280">SQLite &#183; 50k rows</text>

    <text x="720" y="106" font-size="12" font-weight="600" fill="#374151">OmniboxSuggester</text>
    <text x="720" y="121" font-size="12" font-weight="600" fill="#374151">.suggestions</text>
    <text x="720" y="138" font-size="10" fill="#6b7280">500 rows &#8594; top 6</text>

    <text x="900" y="112" font-size="13" font-weight="600" fill="#374151">Dropdown</text>
    <text x="900" y="130" font-size="10" fill="#6b7280">6 rows</text>
  </g>

  <!-- arrows -->
  <g stroke="#9ca3af" stroke-width="1.5">
    <line x1="134" y1="116" x2="176" y2="116" marker-end="url(#flow)"/>
    <line x1="354" y1="116" x2="396" y2="116" marker-end="url(#flow)"/>
    <line x1="594" y1="116" x2="626" y2="116" marker-end="url(#flow)"/>
    <line x1="814" y1="116" x2="846" y2="116" marker-end="url(#flow)"/>
  </g>

  <!-- before / after rows -->
  <g text-anchor="middle" font-size="13">
    <text x="265" y="180" fill="#dc2626">30</text>
    <text x="495" y="180" fill="#dc2626">402&#8211;628</text>
    <text x="720" y="180" fill="#dc2626" font-weight="700">4,370</text>

    <text x="265" y="207" fill="#059669" font-weight="700">30</text>
    <text x="495" y="207" fill="#059669" font-weight="700">391</text>
    <text x="720" y="207" fill="#059669" font-weight="700" font-size="15">1,011</text>
  </g>

  <text x="480" y="262" font-size="13" font-weight="700" fill="#059669" text-anchor="middle">after &#8776; 1,430 allocations per keystroke &#8212; roughly 70% down</text>
  <text x="480" y="296" font-size="10" fill="#6b7280" text-anchor="middle">app-side only &#8212; WebKit content-process allocation is out of scope here; macOS 26.4, release build</text>
</svg>
