<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text {
        font-family: 'Roboto Mono', ui-monospace, monospace;
      }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="320" y="30" text-anchor="middle" fill="#e5e7eb" font-size="18" font-weight="500">Hibernation reclaim: 3 ballast tabs</text>
  
  <!-- Axes -->
  <line x1="80" y1="240" x2="560" y2="240" stroke="#9ca3af" stroke-width="2"/>
  <line x1="80" y1="240" x2="80" y2="80" stroke="#9ca3af" stroke-width="2"/>
  
  <!-- Y-axis labels -->
  <text x="60" y="245" text-anchor="end" fill="#9ca3af" font-size="12">0</text>
  <text x="60" y="165" text-anchor="end" fill="#9ca3af" font-size="12">70</text>
  <text x="60" y="85" text-anchor="end" fill="#9ca3af" font-size="12">140</text>
  <text x="40" y="160" text-anchor="end" fill="#9ca3af" font-size="12" transform="rotate(-90,40,160)">MB</text>
  
  <!-- X-axis labels -->
  <text x="200" y="260" text-anchor="middle" fill="#9ca3af" font-size="13">Before hibernation</text>
  <text x="440" y="260" text-anchor="middle" fill="#9ca3af" font-size="13">After hibernation</text>
  
  <!-- Before bar -->
  <rect x="150" y="102.5" width="100" height="137.5" fill="#ef4444" rx="4"/>
  <text x="200" y="90" text-anchor="middle" fill="#ef4444" font-size="14" font-weight="500">137 MB</text>
  
  <!-- After bar (empty slot) -->
  <rect x="390" y="240" width="100" height="0" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="6 4" rx="4"/>
  <text x="440" y="220" text-anchor="middle" fill="#10b981" font-size="14" font-weight="500">0 MB</text>
  
  <!-- Arrow annotation -->
  <path d="M200,100 L200,180 L380,180 L380,235" stroke="#22d3ee" stroke-width="2" stroke-dasharray="8 4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="290" y="170" text-anchor="middle" fill="#22d3ee" font-size="13">-137 MB (processes terminated, not trimmed)</text>
  
  <!-- Sub-note -->
  <text x="320" y="300" text-anchor="middle" fill="#9ca3af" font-size="13">45.7 MB reclaimed per tab</text>
</svg>