      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="0.55" stop-color="#12204d"/>
      <stop offset="1" stop-color="#0a2e33"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
