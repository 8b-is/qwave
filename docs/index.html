document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;align-items:center;justify-content:space-between\"><span style=\"color:#C2C9D1\">JavaScript<\u002Fspan><div style=\"width:28px;height:16px;border-radius:999px;background:#333A42;padding:2px;display:flex\"><div style=\"width:12px;height:12px;border-radius:50%;background:#767F8A\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07);font:400 11px/1.6 -apple-system,system-ui,sans-serif;color:#98A1AC\">Enforced by WebKit content rules, not injected JavaScript.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"background:#12161A;padding:0 48px\"><div style=\"max-width:1004px;margin:0 auto\"><svg sc-camel-view-box=\"0 0 1004 26\" width=\"100%\" height=\"26\" sc-camel-preserve-aspect-ratio=\"none\" aria-hidden=\"true\"><path d=\"M0 20c14 0 14-14 28-14s14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14\" fill=\"none\" stroke=\"#34A8C0\" stroke-width=\"1.5\" opacity=\".5\"><\u002Fpath><path d=\"M0 24c14 0 14-14 28-14s14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14\" fill=\"none\" stroke=\"#34A8C0\" stroke-width=\"1\" opacity=\".22\"><\u002Fpath><\u002Fsvg><\u002Fdiv><\u002Fdiv>\n\n<section id=\"pillars\" style=\"padding:52px 48px 8px;background:#12161A\">\n<div style=\"max-width:1004px;margin:0 auto\">\n<h2 style=\"margin:0 0 8px;font:600 30px/1.15 -apple-system,system-ui,sans-serif;letter-spacing:-.02em;color:#EFF2F5\">Four things it does differently<\u002Fh2>\n<p style=\"margin:0 0 28px;max-width:62ch;font:400 14.5px/1.6 -apple-system,system-ui,sans-serif;color:#98A1AC\">Each one is a module in the repo with tests behind it. Where something is partly done, this page says which part — and links the code.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n\n<article style=\"display:flex;flex-direction:column;padding:24px 26px;background:#181C21;border:1px solid rgba(255,255,255,.08);border-radius:10px\">\n<div style=\"display:flex;align-items:center;gap:9px;margin-bottom:12px\">\n<div style=\"display:flex;gap:2.5px\"><div style=\"width:3px;height:15px;border-radius:1.5px;background:oklch(0.72 0.11 250)\"><\u002Fdiv><div style=\"width:3px;height:15px;border-radius:1.5px;background:oklch(0.72 0.11 145)\"><\u002Fdiv><div style=\"width:3px;height:15px;border-radius:1.5px;background:oklch(0.72 0.11 300)\"><\u002Fdiv><\u002Fdiv>\n<h3 style=\"margin:0;font:600 17px/1.2 -apple-system,system-ui,sans-serif;color:#EFF2F5\">Containers<\u002Fh3>\n<\u002Fdiv>\n<p style=\"margin:0 0 12px;font:400 13.5px/1.6 -apple-system,system-ui,sans-serif;color:#C2C9D1;text-wrap:pretty\">Each container is its own storage universe — separate cookies, logins, caches, service workers, local storage. Work you and personal you never meet. Burner tabs go further: non-persistent storage, no history written, never restored after quit. Delete a container and the whole store goes with it.<\u002Fp>\n<p style=\"margin:0 0 14px;font:400 11.5px/1.5 ui-monospace,'SF Mono',monospace;color:#98A1AC\">Isolation is WebKit's own <span style=\"color:#34A8C0\">WKWebsiteDataStore(forIdentifier:)<\u002Fspan> — not a cookie-jar trick in our code.<\u002Fp>\n<div style=\"margin-top:auto;display:flex;flex-wrap:wrap;gap:7px\">\n<a href=\"https://github.com/8b-is/qwave/tree/main/Packages/QwaveKit/Sources/BrowserCore\" style=\"padding:4px 9px;border-radius:5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font:500 11px/1.4 ui-monospace,'SF Mono',monospace;color:#C2C9D1;text-decoration:none\">BrowserCore<\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/blob/main/Sources/QwaveApp/SettingsWindow/ContainersPane.swift\" style=\"padding:4px 9px;border-radius:5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font:500 11px/1.4 ui-monospace,'SF Mono',monospace;color:#C2C9D1;text-decoration:none\">ContainersPane.swift<\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/blob/main/docs/ARCHITECTURE.md\" style=\"padding:4px 9px;border-radius:5px;font:500 11px/1.4 ui-monospace,'SF Mono',monospace;color:#34A8C0;text-decoration:none\">ARCHITECTURE.md ↗<\u002Fa>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"display:flex;flex-direction:column;padding:24px 26px;background:#181C21;border:1px solid rgba(255,255,255,.08);border-radius:10px\">\n<div style=\"display:flex;align-items:center;gap:9px;margin-bottom:12px\">\n<svg sc-camel-view-box=\"0 0 16 16\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"#34A8C0\" stroke-width=\"1.5\"><path d=\"M8 1.6l5 1.9v4.2c0 3.2-2.1 5.5-5 6.7-2.9-1.2-5-3.5-5-6.7V3.5z\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin:0;font:600 17px/1.2 -apple-system,system-ui,sans-serif;color:#EFF2F5\">Shields<\u002Fh3>\n<\u002Fdiv>\n<p style=\"margin:0 0 12px;font:400 13.5px/1.6 -apple-system,system-ui,sans-serif;color:#C2C9D1;text-wrap:pretty\">A compiled EasyList snapshot — 59,657 rules — plus HTTPS-First and per-site JavaScript control. The rules are handed to WebKit as native content rules, so blocking happens at the engine's policy boundary before a request leaves, with no injected script on the page.<\u002Fp>\n<p style=\"margin:0 0 14px;font:400 11.5px/1.5 ui-monospace,'SF Mono',monospace;color:#98A1AC\">The shipped list is the committed snapshot. What the repo says is blocked is what's blocked.<\u002Fp>\n<div style=\"margin-top:auto;display:flex;flex-wrap:wrap;gap:7px\">\n<a href=\"https://github.com/8b-is/qwave/tree/main/Packages/QwaveKit/Sources/Shields\" style=\"padding:4px 9px;border-radius:5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font:500 11px/1.4 ui-monospace,'SF Mono',monospace;color:#C2C9D1;text-decoration:none\">Shields<\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/blob/main/scripts/update-blocklist.sh\" style=\"padding:4px 9px;border-radius:5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font:500 11px/1.4 ui-monospace,'SF Mono',monospace;color:#C2C9D1;text-decoration:none\">update-blocklist.sh<\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/blob/main/docs/BLOCKLIST.md\" style=\"padding:4px 9px;border-radius:5px;font:500 11px/1.4 ui-monospace,'SF Mono',monospace;color:#34A8C0;text-decoration:none\">BLOCKLIST.md ↗<\u002Fa>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"display:flex;flex-direction:column;padding:24px 26px;background:#181C21;border:1px solid rgba(255,255,255,.08);border-radius:10px\">\n<div style=\"display:flex;align-items:center;gap:9px;margin-bottom:12px\">\n<svg sc-camel-view-box=\"0 0 20 16\" width=\"20\" height=\"16\" fill=\"none\" stroke=\"#34A8C0\" stroke-width=\"1.5\"><rect x=\"1\" y=\"4\" width=\"14\" height=\"8\" rx=\"2\"><\u002Frect><rect x=\"3\" y=\"6\" width=\"6\" height=\"4\" rx=\"1\" fill=\"#34A8C0\" stroke=\"none\"><\u002Frect><path d=\"M17.5 6.5v3\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin:0;font:600 17px/1.2 -apple-system,system-ui,sans-serif;color:#EFF2F5\">Battery<\u002Fh3>\n<\u002Fdiv>\n<p style=\"margin:0 0 12px;font:400 13.5px/1.6 -apple-system,system-ui,sans-serif;color:#C2C9D1;text-wrap:pretty\">A hibernated tab holds no processes at all — the content process is terminated, not trimmed. Measured on three synthetic ballast tabs: 137.0 MB of WebContent footprint before, 0.0 MB after, 45.7 MB reclaimed per tab, 138 ms to wake back to interactive. Scroll position, history and state survive.<\u002Fp>\n<p style=\"margin:0 0 14px;font:400 11.5px/1.5 ui-monospace,'SF Mono',monospace;color:#98A1AC\">Ballast fixture, Apple Silicon, debug build, 2026-08-13. Real pages vary; the test enforces a floor.<\u002Fp>\n<div style=\"margin-top:auto;display:flex;flex-wrap:wrap;gap:7px\">\n<a href=\"https://github.com/8b-is/qwave/tree/main/Packages/QwaveKit/Sources/BrowserCore\" style=\"padding:4px 9px;border-radius:5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font:500 11px/1.4 ui-monospace,'SF Mono',monospace;color:#C2C9D1;text-decoration:none\">TabHibernator<\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/tree/main/Packages/QwaveKit/Tests\" style=\"padding:4px 9px;border-radius:5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font:500 11px/1.4 ui-monospace,'SF Mono',monospace;color:#C2C9D1;text-decoration:none\">HibernationReclaimTests<\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/blob/main/docs/ENERGY.md\" style=\"padding:4px 9px;border-radius:5px;font:500 11px/1.4 ui-monospace,'SF Mono',monospace;color:#34A8C0;text-decoration:none\">ENERGY.md ↗<\u002Fa>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"display:flex;flex-direction:column;padding:24px 26px;background:#181C21;border:1px solid rgba(255,255,255,.08);border-radius:10px\">\n<div style=\"display:flex;align-items:center;gap:9px;margin-bottom:12px\">\n<svg sc-camel-view-box=\"0 0 16 16\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"#34A8C0\" stroke-width=\"1.5\"><rect x=\"2.5\" y=\"7\" width=\"11\" height=\"7\" rx=\"1.6\"><\u002Frect><path d=\"M5.2 7V4.8a2.8 2.8 0 015.6 0V7\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin:0;font:600 17px/1.2 -apple-system,system-ui,sans-serif;color:#EFF2F5\">Quantum-resistant tunnel option<\u002Fh3>\n<\u002Fdiv>\n<p style=\"margin:0 0 12px;font:400 13.5px/1.6 -apple-system,system-ui,sans-serif;color:#C2C9D1;text-wrap:pretty\">WireGuard through a dedicated system extension, with an optional hybrid key exchange — ML-KEM-768 and Classic McEliece 348864 together — deriving the WireGuard preshared key. Recorded traffic stays unreadable to an attacker who later breaks Curve25519. Turn it on and it fails closed: if the exchange fails, the tunnel refuses to start rather than quietly falling back.<\u002Fp>\n<p style=\"margin:0 0 14px;font:400 11.5px/1.5 ui-monospace,'SF Mono',monospace;color:#98A1AC\">Requires a Mullvad account. Byte-level interop with Mullvad's own client is a follow-up (Stage B.5).<\u002Fp>\n<div style=\"margin-top:auto;display:flex;flex-wrap:wrap;gap:7px\">\n<a href=\"https://github.com/8b-is/qwave/tree/main/Packages/QwaveKit/Sources/PostQuantum\" style=\"padding:4px 9px;border-radius:5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font:500 11px/1.4 ui-monospace,'SF Mono',monospace;color:#C2C9D1;text-decoration:none\">PostQuantum<\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/tree/main/Packages/QwaveKit/Sources/VPNKit\" style=\"padding:4px 9px;border-radius:5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font:500 11px/1.4 ui-monospace,'SF Mono',monospace;color:#C2C9D1;text-decoration:none\">VPNKit<\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/blob/main/Sources/PacketTunnel/PacketTunnelProvider.swift\" style=\"padding:4px 9px;border-radius:5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font:500 11px/1.4 ui-monospace,'SF Mono',monospace;color:#C2C9D1;text-decoration:none\">PacketTunnelProvider.swift<\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/blob/main/docs/CRYPTO_REVIEW.md\" style=\"padding:4px 9px;border-radius:5px;font:500 11px/1.4 ui-monospace,'SF Mono',monospace;color:#34A8C0;text-decoration:none\">CRYPTO_REVIEW.md ↗<\u002Fa>\n<\u002Fdiv>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"background:#12161A;padding:44px 48px 0\"><div style=\"max-width:1004px;margin:0 auto\"><svg sc-camel-view-box=\"0 0 1004 20\" width=\"100%\" height=\"20\" sc-camel-preserve-aspect-ratio=\"none\" aria-hidden=\"true\"><path d=\"M0 10c14 0 14-8 28-8s14 8 28 8 14-8 28-8 14 8 28 8 14-8 28-8 14 8 28 8 14-8 28-8 14 8 28 8 14-8 28-8 14 8 28 8 14-8 28-8 14 8 28 8 14-8 28-8 14 8 28 8 14-8 28-8 14 8 28 8 14-8 28-8 14 8 28 8 14-8 28-8 14 8 28 8 14-8 28-8 14 8 28 8 14-8 28-8 14 8 28 8 14-8 28-8 14 8 28 8 14-8 28-8 14 8 28 8 14-8 28-8 14 8 28 8\" fill=\"none\" stroke=\"#333A42\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><\u002Fdiv>\n\n<section id=\"source\" style=\"padding:36px 48px 56px;background:#12161A\">\n<div style=\"max-width:1004px;margin:0 auto\">\n<h2 style=\"margin:0 0 8px;font:600 30px/1.15 -apple-system,system-ui,sans-serif;letter-spacing:-.02em;color:#EFF2F5\">Read it module by module<\u002Fh2>\n<p style=\"margin:0 0 24px;max-width:64ch;font:400 14.5px/1.6 -apple-system,system-ui,sans-serif;color:#98A1AC;text-wrap:pretty\">One Swift package, one-way dependency graph, Swift 6 language mode with complete strict concurrency. Nothing here is a black box you have to take on faith.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:22px\">\n<a href=\"https://github.com/8b-is/qwave/tree/main/Packages/QwaveKit/Sources/BrowserCore\" style=\"display:flex;align-items:baseline;gap:10px;padding:11px 14px;background:#181C21;border:1px solid rgba(255,255,255,.08);border-radius:8px;text-decoration:none\"><span style=\"flex:none;width:112px;font:500 12px/1.3 ui-monospace,'SF Mono',monospace;color:#34A8C0\">BrowserCore<\u002Fspan><span style=\"font:400 12px/1.45 -apple-system,system-ui,sans-serif;color:#98A1AC\">tabs, containers, navigation, hibernation<\u002Fspan><\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/tree/main/Packages/QwaveKit/Sources/Shields\" style=\"display:flex;align-items:baseline;gap:10px;padding:11px 14px;background:#181C21;border:1px solid rgba(255,255,255,.08);border-radius:8px;text-decoration:none\"><span style=\"flex:none;width:112px;font:500 12px/1.3 ui-monospace,'SF Mono',monospace;color:#34A8C0\">Shields<\u002Fspan><span style=\"font:400 12px/1.45 -apple-system,system-ui,sans-serif;color:#98A1AC\">content rules, HTTPS-First, blocklist updates<\u002Fspan><\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/tree/main/Packages/QwaveKit/Sources/Persistence\" style=\"display:flex;align-items:baseline;gap:10px;padding:11px 14px;background:#181C21;border:1px solid rgba(255,255,255,.08);border-radius:8px;text-decoration:none\"><span style=\"flex:none;width:112px;font:500 12px/1.3 ui-monospace,'SF Mono',monospace;color:#34A8C0\">Persistence<\u002Fspan><span style=\"font:400 12px/1.45 -apple-system,system-ui,sans-serif;color:#98A1AC\">actor-isolated SQLite stores<\u002Fspan><\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/tree/main/Packages/QwaveKit/Sources/MemoryWave\" style=\"display:flex;align-items:baseline;gap:10px;padding:11px 14px;background:#181C21;border:1px solid rgba(255,255,255,.08);border-radius:8px;text-decoration:none\"><span style=\"flex:none;width:112px;font:500 12px/1.3 ui-monospace,'SF Mono',monospace;color:#34A8C0\">MemoryWave<\u002Fspan><span style=\"font:400 12px/1.45 -apple-system,system-ui,sans-serif;color:#98A1AC\">encrypted memory substrate, opt-in providers<\u002Fspan><\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/tree/main/Packages/QwaveKit/Sources/VPNKit\" style=\"display:flex;align-items:baseline;gap:10px;padding:11px 14px;background:#181C21;border:1px solid rgba(255,255,255,.08);border-radius:8px;text-decoration:none\"><span style=\"flex:none;width:112px;font:500 12px/1.3 ui-monospace,'SF Mono',monospace;color:#34A8C0\">VPNKit<\u002Fspan><span style=\"font:400 12px/1.45 -apple-system,system-ui,sans-serif;color:#98A1AC\">Mullvad API, relays, tunnel lifecycle<\u002Fspan><\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/tree/main/Packages/QwaveKit/Sources/PostQuantum\" style=\"display:flex;align-items:baseline;gap:10px;padding:11px 14px;background:#181C21;border:1px solid rgba(255,255,255,.08);border-radius:8px;text-decoration:none\"><span style=\"flex:none;width:112px;font:500 12px/1.3 ui-monospace,'SF Mono',monospace;color:#34A8C0\">PostQuantum<\u002Fspan><span style=\"font:400 12px/1.45 -apple-system,system-ui,sans-serif;color:#98A1AC\">Keccak, ML-KEM-768, McEliece, hybrid KEM<\u002Fspan><\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/tree/main/Packages/QwaveKit/Sources/WebExtensions\" style=\"display:flex;align-items:baseline;gap:10px;padding:11px 14px;background:#181C21;border:1px solid rgba(255,255,255,.08);border-radius:8px;text-decoration:none\"><span style=\"flex:none;width:112px;font:500 12px/1.3 ui-monospace,'SF Mono',monospace;color:#34A8C0\">WebExtensions<\u002Fspan><span style=\"font:400 12px/1.45 -apple-system,system-ui,sans-serif;color:#98A1AC\">MV3 registry and browser.* bridge<\u002Fspan><\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/tree/main/Packages/QwaveKit/Sources/URLIdentity\" style=\"display:flex;align-items:baseline;gap:10px;padding:11px 14px;background:#181C21;border:1px solid rgba(255,255,255,.08);border-radius:8px;text-decoration:none\"><span style=\"flex:none;width:112px;font:500 12px/1.3 ui-monospace,'SF Mono',monospace;color:#34A8C0\">URLIdentity<\u002Fspan><span style=\"font:400 12px/1.45 -apple-system,system-ui,sans-serif;color:#98A1AC\">WHATWG-compatible host identity<\u002Fspan><\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/tree/main/Packages/QwaveKit/Sources/FeatureFlags\" style=\"display:flex;align-items:baseline;gap:10px;padding:11px 14px;background:#181C21;border:1px solid rgba(255,255,255,.08);border-radius:8px;text-decoration:none\"><span style=\"flex:none;width:112px;font:500 12px/1.3 ui-monospace,'SF Mono',monospace;color:#34A8C0\">FeatureFlags<\u002Fspan><span style=\"font:400 12px/1.45 -apple-system,system-ui,sans-serif;color:#98A1AC\">guarded WebKit SPI access<\u002Fspan><\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/tree/main/Packages/QwaveKit/Sources/QwaveSupport\" style=\"display:flex;align-items:baseline;gap:10px;padding:11px 14px;background:#181C21;border:1px solid rgba(255,255,255,.08);border-radius:8px;text-decoration:none\"><span style=\"flex:none;width:112px;font:500 12px/1.3 ui-monospace,'SF Mono',monospace;color:#34A8C0\">QwaveSupport<\u002Fspan><span style=\"font:400 12px/1.45 -apple-system,system-ui,sans-serif;color:#98A1AC\">logging, keychain, egress allowlist<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n<span style=\"font:400 12px/1.4 -apple-system,system-ui,sans-serif;color:#98A1AC;margin-right:4px\">Also:<\u002Fspan>\n<a href=\"https://github.com/8b-is/qwave/tree/main/Sources/QwaveApp\" style=\"padding:5px 10px;border-radius:5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font:500 11.5px/1.4 ui-monospace,'SF Mono',monospace;color:#C2C9D1;text-decoration:none\">Sources/QwaveApp<\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/tree/main/Sources/PacketTunnel\" style=\"padding:5px 10px;border-radius:5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font:500 11.5px/1.4 ui-monospace,'SF Mono',monospace;color:#C2C9D1;text-decoration:none\">Sources/PacketTunnel<\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/blob/main/project.yml\" style=\"padding:5px 10px;border-radius:5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font:500 11.5px/1.4 ui-monospace,'SF Mono',monospace;color:#C2C9D1;text-decoration:none\">project.yml<\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/commits/main\" style=\"padding:5px 10px;border-radius:5px;background:rgba(52,168,192,.12);border:1px solid rgba(52,168,192,.3);font:500 11.5px/1.4 ui-monospace,'SF Mono',monospace;color:#34A8C0;text-decoration:none\">Every commit on main ↗<\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/pulls\" style=\"padding:5px 10px;border-radius:5px;background:rgba(52,168,192,.12);border:1px solid rgba(52,168,192,.3);font:500 11.5px/1.4 ui-monospace,'SF Mono',monospace;color:#34A8C0;text-decoration:none\">Open pull requests ↗<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"honesty\" style=\"padding:56px 48px 60px;background:#0F1114;border-top:1px solid rgba(255,255,255,.07)\">\n<div style=\"max-width:1004px;margin:0 auto\">\n<h2 style=\"margin:0 0 8px;font:600 30px/1.15 -apple-system,system-ui,sans-serif;letter-spacing:-.02em;color:#EFF2F5\">We would rather publish the method than a number<\u002Fh2>\n<p style=\"margin:0 0 26px;max-width:64ch;font:400 14.5px/1.6 -apple-system,system-ui,sans-serif;color:#98A1AC;text-wrap:pretty\">Browser marketing runs on benchmark screenshots. Here is our position: a GUI browser benchmark needs a real display, a real GPU and a human at the Mac, so it cannot run in CI — and a number nobody can reproduce is decoration.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:1.05fr 1fr;gap:16px;margin-bottom:16px\">\n<div style=\"padding:22px 24px;background:#181C21;border:1px solid rgba(255,255,255,.08);border-radius:10px\">\n<div style=\"font:600 10px/1 ui-monospace,'SF Mono',monospace;letter-spacing:.13em;text-transform:uppercase;color:#98A1AC;margin-bottom:14px\">The committed anchor · Speedometer 3, 10 iterations<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font:400 13px/1 -apple-system,system-ui,sans-serif;color:#C2C9D1\">Score<\u002Fspan><span style=\"font:500 14px/1 ui-monospace,'SF Mono',monospace;color:#EFF2F5\">23.88<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font:400 13px/1 -apple-system,system-ui,sans-serif;color:#C2C9D1\">Geomean<\u002Fspan><span style=\"font:500 14px/1 ui-monospace,'SF Mono',monospace;color:#EFF2F5\">42.71 ms<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font:400 13px/1 -apple-system,system-ui,sans-serif;color:#C2C9D1\">Steady-state median<\u002Fspan><span style=\"font:500 14px/1 ui-monospace,'SF Mono',monospace;color:#EFF2F5\">49.57 ms<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:8px 0\"><span style=\"font:400 13px/1 -apple-system,system-ui,sans-serif;color:#C2C9D1\">Cold-start gap <span style=\"color:#D2A03F\">— our worst number<\u002Fspan><\u002Fspan><span style=\"font:500 14px/1 ui-monospace,'SF Mono',monospace;color:#D2A03F\">+54.8 %<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:14px 0 12px;font:400 12px/1.6 -apple-system,system-ui,sans-serif;color:#98A1AC;text-wrap:pretty\">That last row is the one we lead with, because it is the one that is wrong. Iteration 0 is 55% slower than steady state and Speedometer counts it. Target is within 25%. Four fixes — two merged, two open — and none of them is claimed as a win yet: the before/after medians publish here when a human has run them.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n<a href=\"https://github.com/8b-is/qwave/pull/15\" style=\"padding:4px 9px;border-radius:5px;background:rgba(79,180,122,.12);border:1px solid rgba(79,180,122,.3);font:500 11px/1.4 ui-monospace,'SF Mono',monospace;color:#4FB47A;text-decoration:none\">#15 energy-tick · merged<\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/pull/16\" style=\"padding:4px 9px;border-radius:5px;background:rgba(79,180,122,.12);border:1px solid rgba(79,180,122,.3);font:500 11px/1.4 ui-monospace,'SF Mono',monospace;color:#4FB47A;text-decoration:none\">#16 applyLists · merged<\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/pull/17\" style=\"padding:4px 9px;border-radius:5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);font:500 11px/1.4 ui-monospace,'SF Mono',monospace;color:#C2C9D1;text-decoration:none\">#17 chrome-refresh<\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/pull/18\" style=\"padding:4px 9px;border-radius:5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);font:500 11px/1.4 ui-monospace,'SF Mono',monospace;color:#C2C9D1;text-decoration:none\">#18 process pool<\u002Fa>\n<a href=\"https://github.com/8b-is/qwave/issues/19\" style=\"padding:4px 9px;border-radius:5px;background:rgba(210,160,63,.12);border:1px solid rgba(210,160,63,.3);font:500 11px/1.4 ui-monospace,'SF Mono',monospace;color:#D2A03F;text-decoration:none\">#19 deferred · privacy review<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<div style=\"padding:22px 24px;background:#181C21;border:1px solid rgba(52,168,192,.2);border-radius:10px\">\n<div style=\"font:600 10px/1 ui-monospace,'SF Mono',monospace;letter-spacing:.13em;text-transform:uppercase;color:#34A8C0;margin-bottom:12px\">House rules<\u002Fdiv>\n<p style=\"margin:0 0 10px;font:400 13.5px/1.6 -apple-system,system-ui,sans-serif;color:#C2C9D1;text-wrap:pretty\">The benchmark harness runs with the energy governor active and no benchmark-special flags. Pinning a performance tier for a test run would flatter the score and hide the regression, so the harness passes no such flag.<\u002Fp>\n<p style=\"margin:0;font:400 13.5px/1.6 -apple-system,system-ui,sans-serif;color:#C2C9D1;text-wrap:pretty\">Nothing is keyed to a benchmark's URL. No shields are disabled for a test page. Every fix is a real-usage win or it does not ship. <a href=\"https://github.com/8b-is/qwave/blob/main/docs/PERF.md\">The methodology doc<\u002Fa> is the contract, and it is stricter than this paragraph.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding:20px 24px;background:#1C1710;border:1px solid rgba(210,160,63,.32);border-radius:10px\">\n<div style=\"display:flex;align-items:center;gap:8px;margin-bottom:9px\"><div style=\"width:7px;height:7px;border-radius:50%;background:#D2A03F\"><\u002Fdiv><span style=\"font:600 12px/1 -apple-system,system-ui,sans-serif;color:#E6BC63\">One request we are not proud of<\u002Fspan><\u002Fdiv>\n<p style=\"margin:0;font:400 12.5px/1.6 -apple-system,system-ui,sans-serif;color:#C9B489;text-wrap:pretty\">At launch the app makes one conditional fetch of an EasyList mirror on GitHub, and currently throws the result away — it warms a cache for wiring that does not exist yet. It sends nothing beyond what any HTTPS request carries and stores an ETag. It is <a href=\"https://github.com/8b-is/qwave/blob/main/docs/BLOCKLIST.md\">disclosed in the blocklist doc<\u002Fa>, and it either gets wired up properly behind an off-by-default toggle or gets deleted. Status quo is not an option.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"background:#12161A;padding:0 48px\"><div style=\"max-width:1004px;margin:0 auto\"><svg sc-camel-view-box=\"0 0 1004 26\" width=\"100%\" height=\"26\" sc-camel-preserve-aspect-ratio=\"none\" aria-hidden=\"true\"><path d=\"M0 6c14 0 14 14 28 14s14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14 14 14 28 14 14-14 28-14\" fill=\"none\" stroke=\"#34A8C0\" stroke-width=\"1.5\" opacity=\".45\"><\u002Fpath><\u002Fsvg><\u002Fdiv><\u002Fdiv>\n\n<section id=\"download\" style=\"padding:44px 48px 56px;background:#12161A\">\n<div style=\"max-width:1004px;margin:0 auto;display:grid;grid-template-columns:1.15fr 1fr;gap:44px;align-items:start\">\n<div>\n<h2 style=\"margin:0 0 12px;font:600 30px/1.15 -apple-system,system-ui,sans-serif;letter-spacing:-.02em;color:#EFF2F5\">Download<\u002Fh2>\n<p style=\"margin:0 0 20px;max-width:52ch;font:400 14.5px/1.6 -apple-system,system-ui,sans-serif;color:#98A1AC;text-wrap:pretty\">Latest release from GitHub. macOS 14 or newer. Browsing, containers, shields and hibernation work out of the box.<\u002Fp>\n<div style=\"display:flex;align-items:center;gap:12px;margin-bottom:22px\">\n<a href=\"https://github.com/8b-is/qwave/releases/latest\" style=\"padding:12px 22px;border-radius:6px;background:#34A8C0;font:600 14px/1 -apple-system,system-ui,sans-serif;color:#08171B;text-decoration:none\">Get the latest release<\u002Fa>\n<a href=\"https://github.com/8b-is/qwave#build-locally\" style=\"font:400 13px/1 -apple-system,system-ui,sans-serif;color:#C2C9D1\">Build it yourself<\u002Fa>\n<\u002Fdiv>\n<div style=\"padding:18px 20px;background:#181C21;border:1px solid rgba(255,255,255,.1);border-radius:10px\">\n<div style=\"font:600 12px/1 -apple-system,system-ui,sans-serif;color:#EFF2F5;margin-bottom:9px\">About signing, plainly<\u002Fdiv>\n<p style=\"margin:0 0 10px;font:400 12.5px/1.65 -apple-system,system-ui,sans-serif;color:#98A1AC;text-wrap:pretty\">Releases ship unsigned unless the signing pipeline has its certificates, and Gatekeeper will say so. The <a href=\"https://github.com/8b-is/qwave/blob/main/docs/SIGNING.md\">signing guide<\u002Fa> walks through opening it anyway, or building signed with your own Apple team.<\u002Fp>\n<p style=\"margin:0;font:400 12.5px/1.65 -apple-system,system-ui,sans-serif;color:#98A1AC;text-wrap:pretty\">The VPN needs more than a signature: packet-tunnel system extensions require Apple's Network Extension entitlement, which is an Apple-side approval we do not have yet. Until then the tunnel works in builds you sign locally with your own team — the <a href=\"https://github.com/8b-is/qwave/blob/main/docs/SIGNING.md\">activation guide<\u002Fa> is the path.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:22px 24px;background:#181C21;border:1px solid rgba(255,255,255,.1);border-radius:10px\">\n<div style=\"font:600 10px/1 ui-monospace,'SF Mono',monospace;letter-spacing:.13em;text-transform:uppercase;color:#98A1AC;margin-bottom:14px\">Build from source<\u002Fdiv>\n<div style=\"font:400 11.5px/1.9 ui-monospace,'SF Mono',monospace;color:#C2C9D1;overflow-x:auto\">\n<div style=\"color:#8A939E\"># tests<\u002Fdiv>\n<div><span style=\"color:#4FB47A\">swift test<\u002Fspan> --package-path Packages/QwaveKit -c release<\u002Fdiv>\n<div style=\"color:#8A939E;margin-top:8px\"># app<\u002Fdiv>\n<div><span style=\"color:#4FB47A\">xcodegen<\u002Fspan> generate --spec project.yml<\u002Fdiv>\n<div><span style=\"color:#4FB47A\">xcodebuild<\u002Fspan> -scheme Qwave -configuration Release<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:16px 0 0;font:400 12px/1.6 -apple-system,system-ui,sans-serif;color:#98A1AC;text-wrap:pretty\">Needs Xcode 16+, XcodeGen, and Go plus Zig for the packet-tunnel pre-build steps. <a href=\"https://github.com/8b-is/qwave/blob/main/project.yml\">project.yml<\u002Fa> is the source of truth; the Xcode project is generated.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"faq\" style=\"padding:52px 48px 60px;background:#0F1114;border-top:1px solid rgba(255,255,255,.07)\">\n<div style=\"max-width:760px;margin:0 auto\">\n<div style=\"display:flex;align-items:center;gap:12px;margin-bottom:24px\">\n<h2 style=\"margin:0;font:600 30px/1.15 -apple-system,system-ui,sans-serif;letter-spacing:-.02em;color:#EFF2F5\">Questions worth a straight answer<\u002Fh2>\n<svg sc-camel-view-box=\"0 0 60 12\" width=\"60\" height=\"12\" aria-hidden=\"true\"><path d=\"M2 6c5 0 5-4 10-4s5 4 10 4 5-4 10-4 5 4 10 4 5-4 10-4 5 4 6 4\" fill=\"none\" stroke=\"#34A8C0\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n\n<div style=\"border-top:1px solid rgba(255,255,255,.09);padding:18px 0\">\n<h3 style=\"margin:0 0 8px;font:600 15px/1.35 -apple-system,system-ui,sans-serif;color:#EFF2F5\">Why WebKit instead of Chromium?<\u002Fh3>\n<p style=\"margin:0;font:400 13.5px/1.65 -apple-system,system-ui,sans-serif;color:#98A1AC;text-wrap:pretty\">Because the engine your Mac already ships is the one Apple spent years tuning for its own silicon, and shipping a second engine means shipping a second set of processes, a second update channel and a second battery profile. Qwave is a thin AppKit shell over system WebKit: WebKit owns rendering and content processes, we own the chrome, the policy decisions and the storage boundaries. It also means blocking can happen inside the engine instead of as script we inject into your pages.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"border-top:1px solid rgba(255,255,255,.09);padding:18px 0\">\n<h3 style=\"margin:0 0 8px;font:600 15px/1.35 -apple-system,system-ui,sans-serif;color:#EFF2F5\">Is my VPN traffic really protected against quantum attacks?<\u002Fh3>\n<p style=\"margin:0 0 8px;font:400 13.5px/1.65 -apple-system,system-ui,sans-serif;color:#98A1AC;text-wrap:pretty\">Here is the precise version. Stage A is classic WireGuard — Curve25519 and ChaCha20-Poly1305. Stage B, shipped, adds a hybrid key exchange in pure Swift: ML-KEM-768 per FIPS 203 and Classic McEliece 348864, hashed together into a WireGuard preshared key. Symmetric keys are not meaningfully weakened by quantum attacks, so traffic recorded today stays unreadable to someone who breaks Curve25519 later. Both KEMs carry known-answer tests against an independent Python oracle, and enabling the option makes the tunnel fail closed rather than downgrade.<\u002Fp>\n<p style=\"margin:0;font:400 13.5px/1.65 -apple-system,system-ui,sans-serif;color:#98A1AC;text-wrap:pretty\">What is not done: byte-level conformance with Mullvad's own gRPC wire format is Stage B.5, so today the material travels in a versioned JSON envelope over the tunnel gateway. And our McEliece decoder is variable-time by design — auditable Goppa math over constant-time execution — which <a href=\"https://github.com/8b-is/qwave/blob/main/docs/CRYPTO_REVIEW.md\">our own crypto review<\u002Fa> writes up as an accepted finding rather than burying. Read it before you trust it.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"border-top:1px solid rgba(255,255,255,.09);padding:18px 0\">\n<h3 style=\"margin:0 0 8px;font:600 15px/1.35 -apple-system,system-ui,sans-serif;color:#EFF2F5\">Do I need a Mullvad account?<\u002Fh3>\n<p style=\"margin:0;font:400 13.5px/1.65 -apple-system,system-ui,sans-serif;color:#98A1AC;text-wrap:pretty\">For the VPN, yes — Qwave talks to Mullvad's relays with your account number, and we are not a VPN provider. Everything else works without one, and no account is needed to browse. Mullvad is referenced here as a fact of how the tunnel works; they have not endorsed this project.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"border-top:1px solid rgba(255,255,255,.09);padding:18px 0\">\n<h3 style=\"margin:0 0 8px;font:600 15px/1.35 -apple-system,system-ui,sans-serif;color:#EFF2F5\">How is a container different from a browser profile?<\u002Fh3>\n<p style=\"margin:0;font:400 13.5px/1.65 -apple-system,system-ui,sans-serif;color:#98A1AC;text-wrap:pretty\">A profile is usually a separate window or a separate app session you switch between. A container is per-tab: work, personal and a burner can sit side by side in one window, colour-coded in the tab strip, with genuinely separate cookies, logins and caches. Nothing crosses a container identifier, and deleting one removes its WebKit store and its database rows together.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"border-top:1px solid rgba(255,255,255,.09);padding:18px 0\">\n<h3 style=\"margin:0 0 8px;font:600 15px/1.35 -apple-system,system-ui,sans-serif;color:#EFF2F5\">Do my extensions work?<\u002Fh3>\n<p style=\"margin:0;font:400 13.5px/1.65 -apple-system,system-ui,sans-serif;color:#98A1AC;text-wrap:pretty\">Partly, and we will not oversell it. There is a focused <a href=\"https://github.com/8b-is/qwave/tree/main/Packages/QwaveKit/Sources/WebExtensions\">Manifest V3 bridge<\u002Fa> covering tabs, storage and runtime messaging — enough for extensions that live in those APIs, not a full WebExtensions implementation. If an extension reaches for something outside that surface, it will not work yet.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"border-top:1px solid rgba(255,255,255,.09);padding:18px 0\">\n<h3 style=\"margin:0 0 8px;font:600 15px/1.35 -apple-system,system-ui,sans-serif;color:#EFF2F5\">Is it open source, and can I audit what it sends?<\u002Fh3>\n<p style=\"margin:0;font:400 13.5px/1.65 -apple-system,system-ui,sans-serif;color:#98A1AC;text-wrap:pretty\">MIT licensed, whole thing. Requests the browser itself makes are guarded by a committed host allowlist with tests that fail if new network code shows up undocumented, and every one of those hosts is written down in <a href=\"https://github.com/8b-is/qwave/blob/main/docs/NETWORK.md\">the network inventory<\u002Fa> with its trigger and its opt-in state. That is the part of \"proves what it sends\" that is mechanical rather than aspirational.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"border-top:1px solid rgba(255,255,255,.09);border-bottom:1px solid rgba(255,255,255,.09);padding:18px 0\">\n<h3 style=\"margin:0 0 8px;font:600 15px/1.35 -apple-system,system-ui,sans-serif;color:#EFF2F5\">Is this anonymity software?<\u002Fh3>\n<p style=\"margin:0;font:400 13.5px/1.65 -apple-system,system-ui,sans-serif;color:#98A1AC;text-wrap:pretty\">No. It is privacy-oriented software with stronger boundaries than a default browser, and <a href=\"https://github.com/8b-is/qwave/blob/main/SECURITY.md\">the threat model<\u002Fa> is the first document we point you at. If you need anonymity, use tooling built for that.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"padding:0 48px 40px;background:#0F1114\">\n<div style=\"max-width:1004px;margin:0 auto\">\n<svg sc-camel-view-box=\"0 0 1004 30\" width=\"100%\" height=\"30\" sc-camel-preserve-aspect-ratio=\"none\" aria-hidden=\"true\" style=\"margin-bottom:26px\"><path d=\"M0 16c14 0 14-12 28-12s14 12 28 12 14-12 28-12 14 12 28 12 14-12 28-12 14 12 28 12 14-12 28-12 14 12 28 12 14-12 28-12 14 12 28 12 14-12 28-12 14 12 28 12 14-12 28-12 14 12 28 12 14-12 28-12 14 12 28 12 14-12 28-12 14 12 28 12 14-12 28-12 14 12 28 12 14-12 28-12 14 12 28 12 14-12 28-12 14 12 28 12 14-12 28-12 14 12 28 12 14-12 28-12 14 12 28 12 14-12 28-12 14 12 28 12 14-12 28-12 14 12 28 12\" fill=\"none\" stroke=\"#252A30\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg>\n<div style=\"display:flex;align-items:flex-start;gap:48px;flex-wrap:wrap\">\n<div style=\"flex:1;min-width:280px\">\n<svg sc-camel-view-box=\"0 0 132 40\" width=\"96\" height=\"29\" aria-label=\"qwave\" style=\"margin-bottom:14px\"><text x=\"0\" y=\"27\" style=\"font:600 27px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;letter-spacing:-.02em\" fill=\"#98A1AC\">qwave<\u002Ftext><path d=\"M3 34c5 0 5-6 10-6s5 6 10 6 5-6 10-6 5 6 10 6\" fill=\"none\" stroke=\"#34A8C0\" stroke-width=\"2.4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n<p style=\"margin:0 0 10px;max-width:46ch;font:400 12.5px/1.6 -apple-system,system-ui,sans-serif;color:#767F8A;text-wrap:pretty\"><span style=\"color:#C2C9D1\">This page makes no third-party requests.<\u002Fspan> No trackers, no cookies, no analytics, no fonts from someone else's CDN. You can check in the network tab — that is the point of saying it.<\u002Fp>\n<p style=\"margin:0;font:400 12px/1.6 -apple-system,system-ui,sans-serif;color:#8A939E\">MIT · © 2026 8b.is / Peter Lodri · Mullvad, WebKit and Apple are referenced as facts of how this software works, not as endorsements.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;gap:44px\">\n<div style=\"display:flex;flex-direction:column;gap:8px;font:400 12.5px/1 -apple-system,system-ui,sans-serif\">\n<span style=\"font:600 10px/1 ui-monospace,'SF Mono',monospace;letter-spacing:.13em;text-transform:uppercase;color:#8A939E;margin-bottom:2px\">Project<\u002Fspan> e-system,system-ui,sans-serif;color:#C9B489;text-wrap:pretty\"><b style=\"color:#E6BC63\">Some source links are directory-level.<\u002Fb> Module and doc links are verified paths. Type-level links — TabHibernator, HibernationReclaimTests — point at their module or test directory, because I have not listed those files individually. Confirm the filenames before shipping, or leave them pointing at the directory.<\u002Fdiv>\n<div style=\"padding:14px 16px;background:#1C1710;border:1px solid rgba(210,160,63,.32);border-radius:8px;font:400 12px/1.6 -apple-system,system-ui,sans-serif;color:#C9B489;text-wrap:pretty\"><b style=\"color:#E6BC63\">Type is the system stack.<\u002Fb> The design system's display face is IBM Plex Sans, and loading it from a font CDN would make the footer claim false. Self-host a subsetted woff2 (~18 KB) or keep SF as shipped here. Zero font files load today.<\u002Fdiv>\n<div style=\"padding:14px 16px;background:#1C1710;border:1px solid rgba(210,160,63,.32);border-radius:8px;font:400 12px/1.6 -apple-system,system-ui,sans-serif;color:#C9B489;text-wrap:pretty\"><b style=\"color:#E6BC63\">No version number anywhere.<\u002Fb> The download button points at <span style=\"font-family:ui-monospace,'SF Mono',monospace;font-size:11px\">/releases/latest<\u002Fspan> rather than naming a version — I have not read CHANGELOG.md, so any number would be invented, and this way it stays true without a rebuild.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showBuildNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Review&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return { showBuildNotes: this.props.showBuildNotes ?? true };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
