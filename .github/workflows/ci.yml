name: qwave-ci

on:
  push:
    branches: [main, "claude/**", "v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qwave-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: swift-format lint (--strict)
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pin Xcode
        run: |
          # The Blacksmith macos-15 image ships Xcode 26.3 as default.
          # Assert the pin instead of globbing "latest" so an image update
          # cannot change build behaviour without a commit.
          if ls -d /Applications/Xcode_26.3*.app >/dev/null 2>&1; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_26.3*.app | sort -V | tail -n1)/Contents/Developer"
          fi
          xcodebuild -version
          xcodebuild -version | grep -q "Xcode 26.3" || {
            echo "❌ CI image drifted from pinned Xcode 26.3 — update the pin deliberately"
            exit 1
          }
          # CI validates Swift 6 language-mode gates with Xcode 26.3's Swift
          # 6.2 compiler; local migration diagnostics use Swift 6.3.1.
          swift --version
          swift --version | grep -Eq 'Apple Swift version 6\.2(\.| )' || {
            echo "❌ Xcode 26.3 must provide a Swift 6.2 compiler"
            exit 1
          }

      # Packages/WireGuardKit is a pinned upstream and must stay
      # byte-identical to the reviewed revision — never linted or formatted.
      - name: Lint formatting
        run: |
          xcrun swift-format lint --strict --recursive \
            Sources \
            Packages/QwaveKit/Sources \
            Packages/QwaveKit/Tests \
            Packages/QwaveKit/Package.swift \
            Benchmarks/Benchmarks \
            Benchmarks/Package.swift

  unit-tests:
    name: QwaveKit unit tests (swift test)
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pin Xcode
        run: |
          # The Blacksmith macos-15 image ships Xcode 26.3 as default.
          # Assert the pin instead of globbing "latest" so an image update
          # cannot change build behaviour without a commit.
          if ls -d /Applications/Xcode_26.3*.app >/dev/null 2>&1; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_26.3*.app | sort -V | tail -n1)/Contents/Developer"
          fi
          xcodebuild -version
          xcodebuild -version | grep -q "Xcode 26.3" || {
            echo "❌ CI image drifted from pinned Xcode 26.3 — update the pin deliberately"
            exit 1
          }
          # CI validates Swift 6 language-mode gates with Xcode 26.3's Swift
          # 6.2 compiler; local migration diagnostics use Swift 6.3.1.
          swift --version
          swift --version | grep -Eq 'Apple Swift version 6\.2(\.| )' || {
            echo "❌ Xcode 26.3 must provide a Swift 6.2 compiler"
            exit 1
          }

      # Release, not debug. The original reason for this flag is GONE: it was
      # the Classic McEliece keygen KATs (~40s per vector in debug), and that
      # leg was deleted along with its fixtures. ML-KEM-768 is cheap either
      # way — measured locally, PostQuantumTests runs ~1.65s in debug vs
      # ~0.12s in release, so runtime no longer forces the choice.
      # What keeps it here is that this gate then exercises the crypto as it
      # actually ships (optimized), which is worth more than the seconds it
      # saves. KATs are deterministic, so release vs debug does not change
      # outcomes either way; revisit freely.
      - name: Run unit tests
        run: swift test -c release --package-path Packages/QwaveKit

  build-app:
    name: Build Qwave.app (unsigned)
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 45
    needs: unit-tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pin Xcode
        run: |
          # The Blacksmith macos-15 image ships Xcode 26.3 as default.
          # Assert the pin instead of globbing "latest" so an image update
          # cannot change build behaviour without a commit.
          if ls -d /Applications/Xcode_26.3*.app >/dev/null 2>&1; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_26.3*.app | sort -V | tail -n1)/Contents/Developer"
          fi
          xcodebuild -version
          xcodebuild -version | grep -q "Xcode 26.3" || {
            echo "❌ CI image drifted from pinned Xcode 26.3 — update the pin deliberately"
            exit 1
          }
          # CI validates Swift 6 language-mode gates with Xcode 26.3's Swift
          # 6.2 compiler; local migration diagnostics use Swift 6.3.1.
          swift --version
          swift --version | grep -Eq 'Apple Swift version 6\.2(\.| )' || {
            echo "❌ Xcode 26.3 must provide a Swift 6.2 compiler"
            exit 1
          }

      - name: Install tools
        # go: the WireGuardKitGo bridge builds libwg-go.a at compile time
        # (present on GitHub-hosted images, absent on Blacksmith's).
        # zig: the app's "Build Zig packet filter" preBuildScript compiles
        # libqpacket.a and hard-errors if zig is absent.
        run: brew install xcodegen xcbeautify go zig

      - name: Cache SPM checkouts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'Packages/QwaveKit/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Qwave.xcodeproj \
            -scheme Qwave \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY= \
            build | xcbeautify

      - name: Locate built app
        id: locate
        run: |
          APP_PATH="$(find ~/Library/Developer/Xcode/DerivedData -type d -name 'Qwave.app' -path '*Release*' | head -n1)"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Built: $APP_PATH"

      - name: Zip app artifact
        if: steps.locate.outputs.app_path != ''
        run: |
          ditto -c -k --keepParent "${{ steps.locate.outputs.app_path }}" Qwave-v0.1.0-unsigned.zip

      - name: Upload app artifact
        if: steps.locate.outputs.app_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Qwave-v0.1.0-unsigned
          path: Qwave-v0.1.0-unsigned.zip
          retention-days: 14

  # Report-only by design: a dead-code scanner that fails the build on day
  # one gets disabled on day two. Findings land in the job log for triage;
  # the tuned config + triage record live in Packages/QwaveKit/.periphery.yml.
  dead-code-report:
    name: Periphery dead-code report (non-blocking)
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 30
    needs: unit-tests
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pin Xcode
        run: |
          # The Blacksmith macos-15 image ships Xcode 26.3 as default.
          # Assert the pin instead of globbing "latest" so an image update
          # cannot change build behaviour without a commit.
          if ls -d /Applications/Xcode_26.3*.app >/dev/null 2>&1; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_26.3*.app | sort -V | tail -n1)/Contents/Developer"
          fi
          xcodebuild -version
          xcodebuild -version | grep -q "Xcode 26.3" || {
            echo "❌ CI image drifted from pinned Xcode 26.3 — update the pin deliberately"
            exit 1
          }

      - name: Install Periphery
        run: brew install peripheryapp/periphery/periphery

      - name: Scan (report only)
        run: |
          cd Packages/QwaveKit
          periphery scan --quiet || true

  benchmarks:
    name: Benchmark thresholds (mallocCountTotal)
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 30
    needs: unit-tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pin Xcode
        run: |
          # The Blacksmith macos-15 image ships Xcode 26.3 as default.
          # Assert the pin instead of globbing "latest" so an image update
          # cannot change build behaviour without a commit.
          if ls -d /Applications/Xcode_26.3*.app >/dev/null 2>&1; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_26.3*.app | sort -V | tail -n1)/Contents/Developer"
          fi
          xcodebuild -version
          xcodebuild -version | grep -q "Xcode 26.3" || {
            echo "❌ CI image drifted from pinned Xcode 26.3 — update the pin deliberately"
            exit 1
          }

      # package-benchmark's mallocCountTotal metric is backed by jemalloc,
      # which the Blacksmith image does not ship. package-jemalloc is a
      # pkgConfig system target, so install jemalloc and point PKG_CONFIG_PATH
      # at its .pc file, otherwise the build fails with
      # "'jemalloc/jemalloc.h' file not found".
      - name: Install jemalloc
        run: brew install jemalloc

      # Only mallocCountTotal is checked (deterministic per code path);
      # see Benchmarks/README.md.
      - name: Check benchmark thresholds
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix jemalloc)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cd Benchmarks
          swift package benchmark thresholds check --no-progress

  zig-validation:
    name: Zig blocklist validation
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Zig
        run: brew install zig

      - name: Build
        run: |
          cd zig-core
          zig build

      - name: Build static library
        run: |
          cd zig-core
          zig build-lib src/packet.zig -O ReleaseSafe -target aarch64-macos -femit-bin=libqpacket.a

      - name: Test
        run: |
          cd zig-core
          zig build test

      - name: Validate blocklist
        run: |
          cd zig-core
          zig-out/bin/qwave-blocklist ../Packages/QwaveKit/Sources/Shields/Resources/easylist-compiled.json

  # ---------------------------------------------------------------------------
  # Experimental toolchain lane (NON-BLOCKING). Runs the authority test suite
  # on the NEWEST Xcode present on the image (Swift 6.3/6.4-era) to gather
  # evidence for a future toolchain-pin flip. `continue-on-error: true` means
  # it can never fail the run; keep it OUT of branch-protection required checks.
  # Rule: >=5 consecutive greens here justify a pin-flip proposal PR (the
  # authority flip alone). If it flakes, the flake analysis IS the evidence.
  # ---------------------------------------------------------------------------
  unit-tests-next:
    name: unit tests (next toolchain · non-blocking)
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select newest Xcode
        run: |
          # Deliberately the opposite of the authority lane: glob the highest
          # Xcode on the image instead of asserting a pin. Print the resolved
          # toolchain so each run records which Swift version produced the
          # green/red — that record is the pin-flip evidence.
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)"
          [ -z "$newest" ] && newest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest/Contents/Developer"; fi
          xcodebuild -version
          swift --version

      - name: Run unit tests (non-blocking)
        run: swift test -c release --package-path Packages/QwaveKit

  # ---------------------------------------------------------------------------
  # Speedometer anchor + parser check (NON-BLOCKING). A GUI browser benchmark
  # cannot run headlessly on a CI runner — the authoritative Score numbers come
  # from the on-Mac scripts/benchmark.sh runs recorded in each perf PR. This job
  # only guards the committed baseline + parser from drift, and prints the
  # baseline summary. continue-on-error so it can never gate a merge; keep it
  # out of branch-protection required checks. See docs/PERF.md.
  # ---------------------------------------------------------------------------
  perf-anchor:
    name: Speedometer anchor + parser (non-blocking)
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Ensure node
        run: command -v node >/dev/null 2>&1 || brew install node

      - name: Validate parser against committed baseline
        run: node Benchmarks/Speedometer/parse.test.mjs

      - name: Print baseline summary
        run: node Benchmarks/Speedometer/parse.mjs Benchmarks/Speedometer/baseline.json --baseline Benchmarks/Speedometer/baseline.json
