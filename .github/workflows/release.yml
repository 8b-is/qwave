name: release

on:
  push:
    tags:
      - "v*"

env:
  SPARKLE_VERSION: "2.9.5"
  SPARKLE_SHA256: "015336b601493e05c237964954bff6191370003d94edefe663724c88840d73cc"

jobs:
  publish-release:
    name: Build, sign & publish GitHub Release
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pin Xcode
        run: |
          # The Blacksmith macos-15 image ships Xcode 16.4 (16F6) as default.
          # Assert the pin instead of globbing "latest" so an image update
          # cannot change build behaviour without a commit.
          if ls -d /Applications/Xcode_16.4*.app >/dev/null 2>&1; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_16.4*.app | sort -V | tail -n1)/Contents/Developer"
          fi
          xcodebuild -version
          xcodebuild -version | grep -q "Xcode 16.4" || {
            echo "❌ CI image drifted from pinned Xcode 16.4 — update the pin deliberately"
            exit 1
          }

      - name: Install tools
        # go: the WireGuardKitGo bridge builds libwg-go.a at compile time
        # (present on GitHub-hosted images, absent on Blacksmith's).
        # zig: the app's "Build Zig packet filter" preBuildScript compiles
        # libqpacket.a and hard-errors if zig is absent.
        run: brew install xcodegen xcbeautify create-dmg go zig

      - name: Verify tag matches project versions
        run: |
          # v0.3.0-rc.1 → 0.3.0 (prerelease suffix is not part of the bundle version)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="${TAG_VERSION%%-*}"
          # Compare against the DECLARATION COUNT, never a hardcoded number and
          # never `grep -q`. project.yml declares these once per target, and the
          # target list grows: CredentialProvider was added after v1.0.0, which
          # silently broke the old `-ne 2` check below (3 declarations today) and
          # would have rejected a correct tag. An existence check has the mirror
          # failure: a tag matching only PacketTunnel's value would have passed.
          TOTAL_SHORT=$(grep -c 'CFBundleShortVersionString:' project.yml || true)
          MATCH_SHORT=$(grep -c "CFBundleShortVersionString: \"${TAG_VERSION}\"" project.yml || true)
          if [ "$TOTAL_SHORT" -eq 0 ]; then
            echo "❌ No CFBundleShortVersionString declarations found in project.yml"
            exit 1
          fi
          if [ "$MATCH_SHORT" -ne "$TOTAL_SHORT" ]; then
            echo "❌ Tag ${GITHUB_REF_NAME} matches CFBundleShortVersionString on only ${MATCH_SHORT}/${TOTAL_SHORT} targets"
            grep -n "CFBundleShortVersionString" project.yml
            exit 1
          fi
          # CFBundleVersion is what Sparkle compares; enforce the committed
          # scheme major*10000 + minor*100 + patch on EVERY target so a
          # forgotten bump can't ship an update existing installs ignore.
          IFS=. read -r MAJOR MINOR PATCH <<< "$TAG_VERSION"
          EXPECTED_BUILD=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          TOTAL_BUILD=$(grep -c 'CFBundleVersion:' project.yml || true)
          MATCH_BUILD=$(grep -c "CFBundleVersion: \"${EXPECTED_BUILD}\"" project.yml || true)
          if [ "$TOTAL_BUILD" -eq 0 ]; then
            echo "❌ No CFBundleVersion declarations found in project.yml"
            exit 1
          fi
          if [ "$MATCH_BUILD" -ne "$TOTAL_BUILD" ]; then
            echo "❌ Expected CFBundleVersion \"${EXPECTED_BUILD}\" on all ${TOTAL_BUILD} targets, got ${MATCH_BUILD}"
            grep -n "CFBundleVersion" project.yml
            exit 1
          fi

      # Release, not debug — same rationale as ci.yml. Note the original
      # reason (Classic McEliece keygen KATs dominating the suite) no longer
      # applies: that leg is deleted and the KEM tests are now ~1.5s of
      # difference, not ~40 min. Kept so the pre-signing gate runs the crypto
      # in the same optimized configuration that ships.
      - name: Run unit tests
        run: swift test -c release --package-path Packages/QwaveKit

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      # Signing is optional: when the Developer ID secrets are absent the
      # pipeline falls back to the unsigned build so forks and the upstream
      # repo (no certs yet) keep releasing. See docs/SIGNING.md for the
      # exact secrets to add to enable the signed + notarised path.
      - name: Detect signing configuration
        id: signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_B64: ${{ secrets.NOTARY_KEY_B64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          MACOS_APP_PROVISIONING_PROFILE_B64: ${{ secrets.MACOS_APP_PROVISIONING_PROFILE_B64 }}
          MACOS_TUNNEL_PROVISIONING_PROFILE_B64: ${{ secrets.MACOS_TUNNEL_PROVISIONING_PROFILE_B64 }}
        run: |
          if [ -n "$MACOS_CERTIFICATE_P12" ] && [ -n "$MACOS_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Developer ID secrets absent — building unsigned."
          fi
          if [ -n "$NOTARY_KEY_B64" ] && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER_ID" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ App Store Connect API key secrets absent — skipping notarisation."
          fi
          if [ -n "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "appcast=true" >> "$GITHUB_OUTPUT"
          else
            echo "appcast=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ SPARKLE_ED_PRIVATE_KEY absent — skipping appcast generation."
          fi
          if [ -n "$MACOS_APP_PROVISIONING_PROFILE_B64" ] && [ -n "$MACOS_TUNNEL_PROVISIONING_PROFILE_B64" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "vpn_entitlements=true" >> "$GITHUB_OUTPUT"
          else
            echo "vpn_entitlements=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Network Extension provisioning profiles absent — signed artifact will use Distribution-NoVPN.entitlements."
          fi

      - name: Install Network Extension provisioning profiles
        if: steps.signing.outputs.sign == 'true' && steps.signing.outputs.vpn_entitlements == 'true'
        env:
          MACOS_APP_PROVISIONING_PROFILE_B64: ${{ secrets.MACOS_APP_PROVISIONING_PROFILE_B64 }}
          MACOS_TUNNEL_PROVISIONING_PROFILE_B64: ${{ secrets.MACOS_TUNNEL_PROVISIONING_PROFILE_B64 }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          install_profile() {
            local encoded="$1"
            local output="$2"
            echo "$encoded" | base64 --decode > "$output"
            local uuid
            uuid=$(security cms -D -i "$output" | plutil -extract UUID raw -o - -)
            cp "$output" "$PROFILE_DIR/$uuid.provisionprofile"
            echo "$uuid"
          }
          APP_PROFILE_PATH="$RUNNER_TEMP/qwave-app.provisionprofile"
          TUNNEL_PROFILE_PATH="$RUNNER_TEMP/qwave-tunnel.provisionprofile"
          APP_PROFILE_UUID=$(install_profile "$MACOS_APP_PROVISIONING_PROFILE_B64" "$APP_PROFILE_PATH")
          TUNNEL_PROFILE_UUID=$(install_profile "$MACOS_TUNNEL_PROVISIONING_PROFILE_B64" "$TUNNEL_PROFILE_PATH")
          APP_PROFILE_NAME=$(security cms -D -i "$APP_PROFILE_PATH" | plutil -extract Name raw -o - -)
          TUNNEL_PROFILE_NAME=$(security cms -D -i "$TUNNEL_PROFILE_PATH" | plutil -extract Name raw -o - -)
          echo "QWAVE_APP_PROVISIONING_PROFILE=$APP_PROFILE_NAME" >> "$GITHUB_ENV"
          echo "QWAVE_TUNNEL_PROVISIONING_PROFILE=$TUNNEL_PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed app profile $APP_PROFILE_UUID and tunnel profile $TUNNEL_PROFILE_UUID"

      - name: Import Developer ID certificate
        if: steps.signing.outputs.sign == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          KEYCHAIN_PATH="$RUNNER_TEMP/qwave-signing.keychain-db"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          rm "$RUNNER_TEMP/certificate.p12"

      # The generated entitlements declare the Network Extension capability,
      # which needs Apple's Developer ID NE approval + provisioning profiles.
      # Until those exist, CI-signed builds carry empty entitlements: browser
      # and Sparkle updates work, VPN activation does not (docs/SIGNING.md).
      - name: Build (signed Release)
        if: steps.signing.outputs.sign == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          XCODE_ARGS=(
            CODE_SIGN_STYLE=Manual
            CODE_SIGN_IDENTITY="Developer ID Application"
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
            ENABLE_HARDENED_RUNTIME=YES
            OTHER_CODE_SIGN_FLAGS="--timestamp"
          )
          if [ "${{ steps.signing.outputs.vpn_entitlements }}" != "true" ]; then
            XCODE_ARGS+=(
              CODE_SIGN_ENTITLEMENTS="$PWD/Resources/CI/Distribution-NoVPN.entitlements"
              CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO
            )
          fi
          xcodebuild \
            -project Qwave.xcodeproj \
            -scheme Qwave \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            "${XCODE_ARGS[@]}" \
            build | xcbeautify

      - name: Verify signed Network Extension entitlements
        if: steps.signing.outputs.sign == 'true' && steps.signing.outputs.vpn_entitlements == 'true'
        run: |
          set -euo pipefail
          APP_ENTITLEMENTS=$(codesign -d --entitlements :- "$APP_PATH" 2>/dev/null)
          TUNNEL_PATH="$APP_PATH/Contents/Library/SystemExtensions/PacketTunnel.systemextension"
          TUNNEL_ENTITLEMENTS=$(codesign -d --entitlements :- "$TUNNEL_PATH" 2>/dev/null)
          echo "$APP_ENTITLEMENTS" | grep -q "packet-tunnel-provider-systemextension"
          echo "$TUNNEL_ENTITLEMENTS" | grep -q "packet-tunnel-provider-systemextension"
          echo "✅ app and PacketTunnel carry Network Extension entitlements"

      - name: Build (unsigned Release)
        if: steps.signing.outputs.sign != 'true'
        run: |
          set -o pipefail
          xcodebuild \
            -project Qwave.xcodeproj \
            -scheme Qwave \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY= \
            build | xcbeautify

      - name: Locate app
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/Qwave.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Qwave.app not found at $APP_PATH"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      # Sparkle's SPM artifact embeds XPC services and helper executables
      # that Xcode's embed step does not give the hardened runtime — the
      # notary service rejects them (this is the documented Sparkle
      # notarization gotcha). Deep-sign them inside-out, then re-seal the
      # framework and the app.
      - name: Harden embedded Sparkle for notarization
        if: steps.signing.outputs.sign == 'true' && steps.signing.outputs.notarize == 'true'
        run: |
          SPARKLE_FW="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          for nested in \
            "$SPARKLE_FW/Versions/B/XPCServices/Downloader.xpc" \
            "$SPARKLE_FW/Versions/B/XPCServices/Installer.xpc" \
            "$SPARKLE_FW/Versions/B/Autoupdate" \
            "$SPARKLE_FW/Versions/B/Updater.app"; do
            if [ -e "$nested" ]; then
              codesign --force --options runtime --timestamp \
                --sign "Developer ID Application" "$nested"
            fi
          done
          codesign --force --options runtime --timestamp \
            --sign "Developer ID Application" "$SPARKLE_FW"
          codesign --force --options runtime --timestamp \
            --entitlements "$PWD/Resources/CI/Distribution-NoVPN.entitlements" \
            --sign "Developer ID Application" "$APP_PATH"
          codesign --verify --deep --strict -v "$APP_PATH"

      # Regression guard for the Sparkle notarization failure that cost a
      # release cycle: the notary service rejects any embedded executable
      # without a Developer ID signature + hardened runtime, and its error
      # is opaque. Assert every Sparkle helper is correctly signed BEFORE
      # submission, so a future Sparkle bump that adds/moves a helper fails
      # here (fast, clear) instead of at notarytool (slow, cryptic).
      - name: Verify embedded Sparkle helpers are signed + hardened
        if: steps.signing.outputs.sign == 'true' && steps.signing.outputs.notarize == 'true'
        run: |
          SPARKLE_FW="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          fail=0
          for helper in \
            "$SPARKLE_FW/Versions/B/XPCServices/Downloader.xpc" \
            "$SPARKLE_FW/Versions/B/XPCServices/Installer.xpc" \
            "$SPARKLE_FW/Versions/B/Autoupdate" \
            "$SPARKLE_FW/Versions/B/Updater.app" \
            "$SPARKLE_FW"; do
            [ -e "$helper" ] || { echo "❌ missing Sparkle helper: $helper"; fail=1; continue; }
            info="$(codesign -dvv "$helper" 2>&1)"
            echo "$info" | grep -q "Authority=Developer ID Application" \
              || { echo "❌ $helper is not Developer ID signed"; fail=1; }
            echo "$info" | grep -q "flags=.*runtime" \
              || { echo "❌ $helper lacks the hardened runtime"; fail=1; }
            echo "$info" | grep -q "Timestamp=" \
              || { echo "❌ $helper has no secure timestamp"; fail=1; }
          done
          [ "$fail" -eq 0 ] || { echo "Sparkle helpers would be rejected by notarytool"; exit 1; }
          echo "✅ all embedded Sparkle helpers are Developer ID signed, hardened, timestamped"

      - name: Notarize & staple app
        if: steps.signing.outputs.sign == 'true' && steps.signing.outputs.notarize == 'true'
        env:
          NOTARY_KEY_B64: ${{ secrets.NOTARY_KEY_B64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          ditto -c -k --keepParent "$APP_PATH" "Qwave-notarize.zip"
          set +e
          xcrun notarytool submit "Qwave-notarize.zip" \
            --key "$RUNNER_TEMP/notary-key.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait --output-format json > "$RUNNER_TEMP/notary-submit.json"
          SUBMIT_EXIT=$?
          set -e
          SUBMIT_ID=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/notary-submit.json')).get('id',''))" || true)
          SUBMIT_STATUS=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/notary-submit.json')).get('status',''))" || true)
          echo "Submission $SUBMIT_ID → $SUBMIT_STATUS"
          if [ "$SUBMIT_STATUS" != "Accepted" ]; then
            echo "::group::notarytool log (why the submission was rejected)"
            xcrun notarytool log "$SUBMIT_ID" \
              --key "$RUNNER_TEMP/notary-key.p8" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" || true
            echo "::endgroup::"
            exit 1
          fi
          [ "$SUBMIT_EXIT" -eq 0 ] || exit "$SUBMIT_EXIT"
          xcrun stapler staple "$APP_PATH"
          rm "Qwave-notarize.zip"

      - name: Verify Gatekeeper assessment
        if: steps.signing.outputs.sign == 'true' && steps.signing.outputs.notarize == 'true'
        run: spctl -a -vv "$APP_PATH"

      - name: Package DMG
        run: |
          STAGING="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/"
          create-dmg \
            --volname "Qwave" \
            --window-size 540 380 \
            --icon-size 96 \
            --icon "Qwave.app" 140 180 \
            --app-drop-link 400 180 \
            --hide-extension "Qwave.app" \
            --no-internet-enable \
            --skip-jenkins \
            --hdiutil-quiet \
            "Qwave-${GITHUB_REF_NAME}.dmg" \
            "$STAGING/"
          echo "DMG_PATH=Qwave-${GITHUB_REF_NAME}.dmg" >> "$GITHUB_ENV"

      - name: Sign, notarize & staple DMG
        if: steps.signing.outputs.sign == 'true' && steps.signing.outputs.notarize == 'true'
        env:
          NOTARY_KEY_B64: ${{ secrets.NOTARY_KEY_B64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          codesign --force --timestamp --sign "Developer ID Application" "$DMG_PATH"
          set +e
          xcrun notarytool submit "$DMG_PATH" \
            --key "$RUNNER_TEMP/notary-key.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait --output-format json > "$RUNNER_TEMP/notary-dmg.json"
          SUBMIT_EXIT=$?
          set -e
          SUBMIT_ID=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/notary-dmg.json')).get('id',''))" || true)
          SUBMIT_STATUS=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/notary-dmg.json')).get('status',''))" || true)
          echo "DMG submission $SUBMIT_ID → $SUBMIT_STATUS"
          if [ "$SUBMIT_STATUS" != "Accepted" ]; then
            echo "::group::notarytool log (why the DMG was rejected)"
            xcrun notarytool log "$SUBMIT_ID" \
              --key "$RUNNER_TEMP/notary-key.p8" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" || true
            echo "::endgroup::"
            exit 1
          fi
          [ "$SUBMIT_EXIT" -eq 0 ] || exit "$SUBMIT_EXIT"
          xcrun stapler staple "$DMG_PATH"

      - name: Zip app artifact (unsigned fallback)
        if: steps.signing.outputs.sign != 'true'
        run: |
          ditto -c -k --keepParent "$APP_PATH" "Qwave-${GITHUB_REF_NAME}-unsigned.zip"
          echo "ZIP_PATH=Qwave-${GITHUB_REF_NAME}-unsigned.zip" >> "$GITHUB_ENV"

      # The appcast is generated ONLY for signed+notarised, non-prerelease
      # builds: unsigned artifacts must never enter the EdDSA-trusted update
      # channel (generate_appcast rejects them anyway — SUSparkleErrorDomain
      # code 2 — which would kill the whole release job), and /releases/latest
      # never serves prereleases so rc enclosures must stay out of the feed.
      - name: Verify Sparkle key pairs with SUPublicEDKey
        if: steps.signing.outputs.appcast == 'true' && steps.signing.outputs.sign == 'true' && steps.signing.outputs.notarize == 'true' && !contains(github.ref_name, '-')
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          cat > "$RUNNER_TEMP/derive-pubkey.swift" <<'EOF'
          import CryptoKit
          import Foundation
          let env = ProcessInfo.processInfo.environment
          guard let seedB64 = env["SPARKLE_ED_PRIVATE_KEY"]?.trimmingCharacters(in: .whitespacesAndNewlines),
                let seed = Data(base64Encoded: seedB64),
                let key = try? Curve25519.Signing.PrivateKey(rawRepresentation: seed)
          else {
            FileHandle.standardError.write(Data("malformed SPARKLE_ED_PRIVATE_KEY\n".utf8))
            exit(1)
          }
          print(key.publicKey.rawRepresentation.base64EncodedString())
          EOF
          ACTUAL=$(swift "$RUNNER_TEMP/derive-pubkey.swift")
          EXPECTED=$(grep 'SUPublicEDKey:' project.yml | awk '{print $2}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "❌ SPARKLE_ED_PRIVATE_KEY does not pair with the committed SUPublicEDKey"
            echo "   derived: $ACTUAL"
            echo "   committed: $EXPECTED"
            exit 1
          fi

      - name: Generate Sparkle appcast
        if: steps.signing.outputs.appcast == 'true' && steps.signing.outputs.sign == 'true' && steps.signing.outputs.notarize == 'true' && !contains(github.ref_name, '-')
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          curl -fsSL -o "Sparkle-${SPARKLE_VERSION}.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "${SPARKLE_SHA256}  Sparkle-${SPARKLE_VERSION}.tar.xz" | shasum -a 256 -c -
          mkdir -p sparkle-dist
          tar -xJf "Sparkle-${SPARKLE_VERSION}.tar.xz" -C sparkle-dist

          mkdir -p updates
          cp "$DMG_PATH" updates/
          # Reuse the previous appcast so the feed keeps update history.
          curl -fsSL -o updates/appcast.xml \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml" || true

          echo "$SPARKLE_ED_PRIVATE_KEY" | ./sparkle-dist/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            -o updates/appcast.xml \
            updates/
          echo "APPCAST_PATH=updates/appcast.xml" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            ${{ env.DMG_PATH }}
            ${{ env.ZIP_PATH }}
            ${{ env.APPCAST_PATH }}
          name: "Qwave ${{ github.ref_name }}"
          body: |
            ## Qwave ${{ github.ref_name }}

            Signed builds pass Gatekeeper (`spctl -a -vv`) and auto-update via
            Sparkle (`appcast.xml` attached). Unsigned builds are published as
            a zip when Developer ID secrets are not configured — see
            `docs/SIGNING.md` for enabling the signed pipeline.

            Full changes: see `CHANGELOG.md`.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
